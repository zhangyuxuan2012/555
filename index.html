<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  @supports (height:100dvh) { body { height:100dvh; } }
  body {
    height:100%; display:flex; flex-direction:column;
    background: radial-gradient(1100px 650px at 50% -12%, #1a2c52 0%, #0c1730 48%, #081022 100%);
    font-family:"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#dcefff; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px; }
  #stage { position:relative; line-height:0; }
  canvas#game {
    display:block; touch-action:none; border-radius:14px;
    box-shadow: 0 0 0 1px rgba(120,210,255,.22), 0 8px 28px rgba(10,30,70,.45), 0 24px 64px rgba(0,0,0,.35);
    background:#0a1224; cursor:none;
  }
  #bar { display:flex; gap:8px; align-items:center; justify-content:center; padding:6px 8px; padding-bottom:calc(6px + env(safe-area-inset-bottom)); flex-wrap:wrap; }
  #bar .logo { font-size:12px; letter-spacing:2px; color:#6d94c4; font-weight:600; }
  .btn {
    font-family:inherit; font-size:12px; letter-spacing:1px; color:#e4f4ff;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(140,210,255,.28);
    border-radius:10px; padding:7px 13px; cursor:pointer;
    transition:all .13s cubic-bezier(.2,.8,.3,1);
    touch-action:manipulation; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .btn:hover { background:rgba(120,200,255,.22); border-color:rgba(140,220,255,.55); transform:translateY(-1px); box-shadow:0 6px 18px rgba(60,160,255,.22); }
  .btn:active { transform:translateY(0); }
  .touch-only { display:none; }
  body.touch .touch-only { display:inline-block; }

  /* ===== Lobby ===== */
  #lobby {
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(8,14,30,.72); backdrop-filter:blur(10px) saturate(1.2); -webkit-backdrop-filter:blur(10px) saturate(1.2); overflow:auto;
  }
  #lobby.hidden { display:none; }
  .lb-inner { width:min(94%,720px); text-align:center; padding:22px 12px; }
  .lb-title { font-size:clamp(28px,6vw,42px); letter-spacing:4px; font-weight:800; color:#9fe8ff;
    text-shadow:0 2px 24px rgba(90,200,255,.35); animation:floaty 5s ease-in-out infinite; }
  @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .lb-title span { display:block; font-size:11px; letter-spacing:5px; color:#7fa8d8; font-weight:500; margin-top:8px; }
  .lb-stats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:18px 0 4px; }
  .lb-card {
    background:rgba(255,255,255,.06); border:1px solid rgba(150,210,255,.18);
    border-radius:14px; padding:11px 16px; font-size:12px; color:#a8c8ea; min-width:120px;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:floaty 6s ease-in-out infinite;
  }
  .lb-card:nth-child(2){ animation-delay:.6s; } .lb-card:nth-child(3){ animation-delay:1.2s; }
  .lb-card b { display:block; font-size:18px; color:#ffe08a; font-family:Consolas,monospace; margin-top:3px; }
  .lb-hint { font-size:12px; color:#8fb0d4; margin:12px 0 16px; letter-spacing:.6px; line-height:2; }
  .lb-hint .key { color:#7dffc8; font-weight:700; }
  .lb-hint .warn { color:#ffd166; font-weight:700; }
  .lb-actions { display:flex; flex-direction:column; gap:12px; align-items:center; margin-top:8px; }
  .lb-sub-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .lb-btn { padding:10px 18px; font-size:13px; }
  .big-start {
    padding:16px 42px; font-size:20px; letter-spacing:3px; font-weight:800; cursor:pointer;
    color:#04121c; background:linear-gradient(160deg,#8ef0d0,#3dd4a0);
    border:none; border-radius:16px; box-shadow:0 10px 30px rgba(80,220,170,.35);
    transition:all .16s cubic-bezier(.2,.8,.3,1); touch-action:manipulation;
  }
  .big-start:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 16px 40px rgba(80,220,170,.45); }
  .big-start:active { transform:translateY(0) scale(.99); }
  .range-panel {
    width:min(94%,560px); text-align:left; margin:18px auto 0;
    background:rgba(255,255,255,.05); border:1px solid rgba(150,210,255,.16);
    border-radius:16px; padding:16px 18px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .range-panel h3 { font-size:14px; letter-spacing:2px; color:#9fe8ff; margin-bottom:10px; }
  .range-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .range-btn {
    padding:10px 6px; border-radius:12px; border:1px solid rgba(150,210,255,.22);
    background:rgba(255,255,255,.05); color:#cfe8ff; font-family:inherit; font-size:13px; cursor:pointer;
    transition:all .13s; touch-action:manipulation;
  }
  .range-btn:hover { background:rgba(120,200,255,.16); transform:translateY(-1px); }
  .range-btn.on { border-color:#6ee7c8; background:rgba(70,210,170,.22); box-shadow:0 4px 16px rgba(70,210,170,.22); color:#eafff8; }
  .range-btn .cnt { display:block; font-size:10px; color:#7fa8d0; margin-top:3px; }

  /* ===== Quiz Modal ===== */
  #quiz {
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(8,14,32,.66); backdrop-filter:blur(10px) saturate(1.15); -webkit-backdrop-filter:blur(10px) saturate(1.15);
  }
  #quiz.show { display:flex; animation:fadeIn .18s ease; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .quiz-panel {
    width:min(92%,470px); max-height:92%; overflow:auto; padding:22px 24px; text-align:center;
    background:rgba(18,32,58,.97); border:1px solid rgba(140,210,255,.32); border-radius:20px;
    box-shadow:0 18px 50px rgba(10,30,80,.45);
    animation:popIn .22s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes popIn { from{ transform:translateY(14px) scale(.96); opacity:0; } to{ transform:translateY(0) scale(1); opacity:1; } }
  .quiz-tag { display:inline-block; font-size:11px; letter-spacing:2px; color:#7dffc8;
    background:rgba(125,255,200,.12); border:1px solid rgba(125,255,200,.4); border-radius:20px; padding:4px 14px; margin-bottom:10px; }
  .quiz-tag.sentence { color:#ffd166; border-color:rgba(255,209,102,.5); background:rgba(255,209,102,.1); }
  .quiz-tag.danger { color:#ff8a9d; border-color:rgba(255,110,130,.55); background:rgba(255,90,110,.12); animation:pulseTag 1.2s ease-in-out infinite; }
  .quiz-tag.listen { color:#8fd0ff; border-color:rgba(140,200,255,.5); background:rgba(120,190,255,.12); }
  .quiz-tag.spell { color:#ffd08a; border-color:rgba(255,190,120,.5); background:rgba(255,180,100,.12); }
  .quiz-tag.enc { color:#d7b3ff; border-color:rgba(190,150,255,.5); background:rgba(180,140,255,.12); }
  .quiz-tag.wrongbook { color:#ffb3c1; border-color:rgba(255,150,170,.5); background:rgba(255,130,150,.12); }
  .quiz-tag.gaokao { color:#ffd700; border-color:rgba(255,215,0,.5); background:rgba(255,200,0,.12); }
  .quiz-tag.revive { color:#7dffc8; border-color:rgba(125,255,200,.55); background:rgba(125,255,200,.14); animation:pulseTag 1.2s ease-in-out infinite; }
  @keyframes pulseTag { 0%,100%{ box-shadow:0 0 0 0 rgba(255,100,120,.35);} 50%{ box-shadow:0 0 0 8px rgba(255,100,120,0);} }
  .quiz-word { font-size:34px; font-weight:800; letter-spacing:1px; color:#a5ecff;
    margin:6px 0; cursor:pointer; transition:color .12s; }
  .quiz-word:hover { color:#e0f8ff; }
  .quiz-phon { font-size:15px; color:#8fb4dc; margin-bottom:4px; }
  .quiz-pos { font-size:12px; color:#7fa0c8; margin-bottom:10px; }
  .quiz-sentence-en { font-size:20px; font-weight:700; color:#ffe08a; line-height:1.55; margin:8px 0; cursor:pointer; }
  .quiz-sentence-en:hover { color:#fff0c0; }
  .speak-btn {
    display:inline-flex; align-items:center; gap:6px; margin:2px 0 10px;
    padding:7px 16px; border-radius:20px; border:1px solid rgba(140,210,255,.35);
    background:rgba(120,200,255,.14); color:#dff4ff; font-family:inherit; font-size:13px;
    cursor:pointer; transition:all .13s; touch-action:manipulation;
  }
  .speak-btn:hover { background:rgba(120,200,255,.3); transform:translateY(-1px); box-shadow:0 6px 16px rgba(80,180,255,.25); }
  .quiz-reward { font-size:12px; color:#7dffc8; margin-bottom:12px; }
  .quiz-reward.danger-note { color:#ffb0bc; }
  .quiz-listen-hint { font-size:12px; color:#9fb8d8; margin-bottom:10px; }
  .quiz-word.listen-word { font-size:40px; cursor:pointer; }
  .quiz-opts { display:flex; flex-direction:column; gap:9px; margin:10px 0; }
  .opt-btn {
    padding:12px 14px; border-radius:12px; border:1px solid rgba(140,210,255,.28);
    background:rgba(255,255,255,.05); color:#e8f6ff; font-family:inherit; font-size:15px; cursor:pointer;
    text-align:left; transition:all .12s; touch-action:manipulation;
  }
  .opt-btn:hover { border-color:#7ad7ff; background:rgba(110,200,255,.16); transform:translateX(3px); }
  .opt-btn.correct { border-color:#7dffc8; background:rgba(45,200,130,.3); box-shadow:0 4px 18px rgba(90,230,170,.28); }
  .opt-btn.wrong { border-color:#ff7a8c; background:rgba(220,80,100,.28); box-shadow:0 4px 18px rgba(255,100,120,.25); }
  .opt-btn .lbl { color:#4fd8ff; font-weight:800; margin-right:8px; }
  .type-input {
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(140,210,255,.35);
    background:rgba(255,255,255,.06); color:#e8f6ff; font-family:inherit; font-size:16px; text-align:center;
    outline:none; letter-spacing:1px;
  }
  .type-input:focus { border-color:#6ee0ff; box-shadow:0 0 0 3px rgba(90,210,255,.18); }
  .quiz-mode-toggle { display:flex; gap:8px; justify-content:center; margin:10px 0; }
  .quiz-mode-toggle .btn { padding:6px 14px; font-size:12px; }
  .quiz-mode-toggle .btn.on { background:rgba(110,200,255,.3); border-color:#7ad7ff; }
  .quiz-submit { margin-top:8px; width:100%; padding:12px 0; font-size:15px; letter-spacing:2px; font-weight:700;
    color:#04121c; background:linear-gradient(160deg,#8ef0d0,#3dd4a0); border:none; border-radius:12px; cursor:pointer;
    transition:all .13s; }
  .quiz-submit:hover { transform:translateY(-1px); box-shadow:0 8px 22px rgba(70,210,170,.3); }
  .quiz-feedback { font-size:14px; font-weight:700; margin:10px 0; min-height:20px; }
  .quiz-feedback.ok { color:#7dffc8; }
  .quiz-feedback.no { color:#ff9aa8; }
  .quiz-answer-reveal { font-size:13px; color:#a8c8ea; margin:6px 0; line-height:1.6; }
  .quiz-continue { width:100%; padding:12px 0; font-size:15px; letter-spacing:2px; font-weight:700;
    color:#04121c; background:linear-gradient(160deg,#7ad7ff,#2f9fd4); border:none; border-radius:12px; cursor:pointer; margin-top:8px;
    transition:all .13s; }
  .quiz-continue:hover { transform:translateY(-1px); box-shadow:0 8px 22px rgba(70,180,255,.28); }
  .quiz-continue.ko { background:linear-gradient(160deg,#ff8a9d,#e2556a); color:#fff; }

  /* ===== Pause / GameOver ===== */
  #ui {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(8,14,30,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:50;
  }
  #ui.show { display:flex; }
  .panel {
    width:min(88%,380px); max-height:90%; overflow:auto; padding:20px 22px; text-align:center;
    background:rgba(18,32,58,.96); border:1px solid rgba(140,210,255,.28); border-radius:18px;
    box-shadow:0 16px 44px rgba(10,30,80,.4); animation:popIn .22s cubic-bezier(.2,.9,.3,1.1);
  }
  .panel h2 { color:#9fe8ff; font-size:20px; letter-spacing:2px; margin-bottom:4px; }
  .panel .en { font-size:10px; letter-spacing:3px; color:#6d90b8; margin-bottom:10px; }
  .stat-line { display:flex; justify-content:space-between; font-size:13px; padding:6px 2px; border-bottom:1px dashed rgba(120,170,220,.2); color:#b0ccea; }
  .stat-line b { color:#ffe08a; font-family:Consolas,monospace; }
  .panel .col { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .panel .col .btn { width:100%; padding:11px 0; font-size:14px; letter-spacing:2px; }

  #toast {
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:99;
    background:rgba(22,40,70,.95); border:1px solid rgba(140,210,255,.4); border-radius:12px;
    padding:10px 18px; font-size:13px; color:#e0f2ff; display:none; box-shadow:0 10px 30px rgba(10,30,80,.35);
    max-width:86%; text-align:center; animation:toastIn .2s ease;
  }
  @keyframes toastIn { from{ opacity:0; transform:translateX(-50%) translateY(8px);} to{ opacity:1; transform:translateX(-50%) translateY(0);} }
  #toast.warn { border-color:rgba(255,190,90,.55); color:#ffe2a8; background:rgba(60,42,18,.95); }

  /* Top hint banner (no-shell guidance) */
  #hint {
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:99;
    background:rgba(40,30,12,.94); border:1px solid rgba(255,200,90,.55); border-radius:12px;
    padding:11px 20px; font-size:14px; color:#ffe4a8; display:none; box-shadow:0 8px 26px rgba(20,10,0,.4);
    max-width:88%; text-align:center; font-weight:600; letter-spacing:.5px;
    animation:hintIn .22s ease;
  }
  @keyframes hintIn { from{ opacity:0; transform:translateX(-50%) translateY(-10px);} to{ opacity:1; transform:translateX(-50%) translateY(0);} }
  #hint .key { color:#ffd166; font-weight:800; }
  .lb-credit { margin-top:20px; font-size:11px; color:#6d90b8; letter-spacing:2px; }

  /* ===== Settings / Shop modal ===== */
  #modal {
    position:fixed; inset:0; z-index:85; display:none; align-items:center; justify-content:center;
    background:rgba(8,14,32,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  #modal.show { display:flex; animation:fadeIn .18s ease; }
  .modal-title { font-size:18px; font-weight:800; letter-spacing:2px; color:#9fe8ff; margin-bottom:2px; }
  .modal-sub { font-size:11px; letter-spacing:2px; color:#6d90b8; margin-bottom:14px; }
  .modal-section { text-align:left; margin:10px 0; padding:12px 14px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(150,210,255,.16); }
  .modal-section h4 { font-size:13px; letter-spacing:1px; color:#7dffc8; margin-bottom:8px; }
  .modal-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; color:#cfe8ff; }
  .modal-row .lbl b { display:block; font-size:11px; color:#7fa0c8; font-weight:400; margin-top:2px; }
  .modal-row .val { color:#ffe08a; font-family:Consolas,monospace; }
  .shop-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px dashed rgba(120,170,220,.2); }
  .shop-item:last-child { border-bottom:none; }
  .shop-item .si-l { flex:1; }
  .shop-item .si-thumb { flex-shrink:0; width:64px; height:48px; margin-right:12px; border-radius:8px;
    background:rgba(0,0,0,0.35); border:1px solid rgba(150,210,255,.18); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .shop-item .si-thumb img { width:100%; height:100%; object-fit:contain; image-rendering:auto; }
  .shop-item .si-body { flex:1; }
  .shop-item .si-name { font-size:14px; color:#e8f6ff; font-weight:600; }
  .shop-item .si-desc { font-size:11px; color:#8fb0d4; margin-top:2px; }
  .shop-item .si-own { color:#7dffc8; font-size:11px; margin-top:2px; }
  .shop-item .si-btn { flex-shrink:0; margin-left:10px; padding:7px 14px; font-size:12px; }
  .shop-item .si-btn.owned { background:rgba(70,210,170,.2); border-color:#6ee7c8; color:#7dffc8; cursor:default; }
  .shop-item .si-btn.on { background:rgba(125,255,200,.22); border-color:#7dffc8; color:#7dffc8; }
  .si-rate { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .si-rate .si-btn { margin-left:0; padding:6px 12px; font-size:11px; }
  .modal-close { margin-top:12px; width:100%; padding:11px 0; font-size:14px; letter-spacing:2px;
    color:#04121c; background:linear-gradient(160deg,#7ad7ff,#2f9fd4); border:none; border-radius:12px; cursor:pointer; }
  .coin-display { display:flex; gap:10px; justify-content:center; margin:6px 0 12px; flex-wrap:wrap; }
  .coin-chip { padding:8px 16px; border-radius:12px; border:1px solid rgba(255,209,102,.4);
    background:rgba(255,209,102,.1); font-size:13px; color:#ffe08a; }

  /* ===== Memory strength (SRS) ===== */
  .mastery-bar { position:relative; height:8px; border-radius:5px; background:rgba(255,255,255,.08);
    overflow:hidden; margin-top:4px; }
  .mastery-fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px; transition:width .4s ease; }
  .mf-new   { background:#f09595; }   /* 易错 / 低强度 */
  .mf-low   { background:#ef9f27; }   /* 学习中 */
  .mf-mid   { background:#fad775; }   /* 较熟 */
  .mf-high  { background:#7dffc8; }   /* 已掌握 */
  .strength-word { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;
    border-bottom:1px dashed rgba(120,170,220,.18); }
  .strength-word:last-child { border-bottom:none; }
  .sw-main { flex:1; min-width:0; }
  .sw-head { display:flex; align-items:baseline; gap:8px; }
  .sw-en { font-size:14px; color:#e8f6ff; font-weight:600; }
  .sw-cn { font-size:11px; color:#8fb0d4; }

// migrate legacy records: backfill SRS fields (s=strength, t=lastSeen) from history
(function migrateStats(){
  let changed=false;
  for(const k in stats.words){
    const rec=stats.words[k];
    if(rec && rec.s===undefined){
      const acc = (rec.c||0)/((rec.c||0)+(rec.w||0)||1);
      // estimate starting strength from historical accuracy
      rec.s = acc>=0.85?4 : acc>=0.6?3 : acc>=0.35?2 : acc>0?1 : 0;
      rec.t = Date.now() - (rec.s>=3 ? 3*24*60*60*1000 : 0); // stronger => mark as "seen a while ago"
      changed=true;
    }
  }
  if(changed) saveStats();
})();
function saveStats(){ saveLS('wt_stats', stats); }
function statRecord(en, correct){
  const key = String(en||'').trim().toLowerCase();
  if(!key) return;
  if(!stats.words[key]) stats.words[key]={c:0,w:0};
  if(correct) stats.words[key].c++; else stats.words[key].w++;
  stats.total++; if(correct) stats.correct++;
  // SRS: update memory strength + last-seen timestamp
  const rec = stats.words[key];
  if(correct){
    rec.s = Math.min(5, (rec.s||0) + 1);   // strength up on correct
  } else {
    rec.s = 0;                               // strength reset on wrong
  }
  rec.t = Date.now();                        // last seen now
  saveStats();
}

/* ================= Spaced Repetition (SRS) =================
 * Memory strength s ∈ [0..5], last-seen timestamp t.
 * Review is "due" once enough time has passed since t, per strength:
 *   s=0  -> immediately (brand new / just missed)
 *   s=1  -> 1 hour
 *   s=2  -> 1 day
 *   s=3  -> 3 days
 *   s=4  -> 7 days
 *   s=5  -> 30 days (mastered, rarely resurfaces)
 * ============================================================ */
const SRS_INTERVALS = [0, 60*60*1000, 24*60*60*1000, 3*24*60*60*1000, 7*24*60*60*1000, 30*24*60*60*1000];
function srsInterval(s){
  const lvl = Math.max(0, Math.min(5, s|0));
  return SRS_INTERVALS[lvl];
}
function srsDueAt(s){ return srsInterval(s); }
function srsIsDue(rec){
  if(!rec || rec.s===undefined) return true;      // never tracked => treat as due
  const last = rec.t||0;
  return (Date.now() - last) >= srsInterval(rec.s);
}
// mastery % (0..100) derived from strength + recent accuracy
function masteryPct(rec){
  if(!rec) return 0;
  const s = Math.max(0, Math.min(5, rec.s||0));
  return Math.round(s/5*100);
}
function masteryLevel(pct){
  if(pct<=0) return 'new';
  if(pct<=40) return 'low';
  if(pct<=80) return 'mid';
  return 'high';
}
function masteryLabel(pct){
  const lvl = masteryLevel(pct);
  if(lvl==='new') return '易错';
  if(lvl==='low') return '学习中';
  if(lvl==='mid') return '较熟';
  return '已掌握';
}
function srsNextReviewLabel(rec){
  if(!rec) return '待学习';
  const s = Math.max(0, Math.min(5, rec.s||0));
  const names = ['立即','1 小时','1 天','3 天','7 天','30 天'];
  return names[s];
}
// collect due words (indexed into WORDS by en) for spaced-repetition re-testing
function srsDueIndices(){
  const due = [];
  for(let i=0;i<WORDS.length;i++){
    const key = WORDS[i].w.trim().toLowerCase();
    const rec = stats.words[key];
    if(rec && rec.c+rec.w>0 && srsIsDue(rec)) due.push(i);
  }
  return due;
}

function inScope(i){
  if(scope==='all') return true;
  const g = gradeBand(i);
  if(scope==='grade7') return g==='grade7';
  if(scope==='grade8') return g==='grade8';
  if(scope==='grade9') return g==='grade9';
  return true;
}

function activeWordList(){
  const list = [];
  for(let i=0;i<WORDS.length;i++) if(inScope(i)) list.push(i);
  return list;
}

function pickQuestion(){
  // Custom scope has its own dedicated flow
  if(scope==='custom') return pickCustomQuestion();
  // Wrong-book scope: review only persistent wrong words
  if(scope==='wrongbook') return pickWrongBookQuestion();
  // Gaokao scope: drill the independent 938-word high-frequency list
  if(scope==='gaokao') return pickGaokaoQuestion();
  // Session wrong words (answered wrong this run): 45% chance to re-test
  if(wrongQueue.length && Math.random()<0.45){
    const idx = wrongQueue[(Math.random()*wrongQueue.length)|0];
    return buildTypedWordQuestion(idx);
  }
  // Historical wrong words (from previous runs): 20% chance to re-test
  if(wrongBook.length && Math.random()<0.20){
    const item = wrongBook[(Math.random()*wrongBook.length)|0];
    const idx = findWordIndexByEn(item.en);
    if(idx>=0){
      return buildTypedWordQuestion(idx);
    }
  }
  // Spaced repetition: due words (need review) get high priority
  const due = srsDueIndices();
  if(due.length && Math.random()<0.35){
    const idx = due[(Math.random()*due.length)|0];
    return buildTypedWordQuestion(idx);
  }
  const pool = activeWordList();
  if(!pool.length) return null;
  const idx = pool[(Math.random()*pool.length)|0];
  // sentence chance (configurable)
  if(SENTENCES.length && Math.random()<(quizPrefs.sentenceRate||0.16)){
    return buildSentenceQuestion();
  }
  // word-based question: pick a subtype (meaning / listen / spell / enChoice)
  return buildTypedWordQuestion(idx);
}

// Map an English word back to its built-in WORDS index (for wrong-book retest)
function findWordIndexByEn(en){
  const key = String(en||'').trim().toLowerCase();
  for(let i=0;i<WORDS.length;i++) if(WORDS[i].w.toLowerCase()===key) return i;
  return -1;
}

// Choose a word-question subtype based on enabled preferences
function buildTypedWordQuestion(idx){
  const kinds=[];
  kinds.push('meaning'); // always available (select Chinese meaning)
  if(quizPrefs.listen) kinds.push('listen');
  if(quizPrefs.spell) kinds.push('spell');
  if(quizPrefs.enChoice) kinds.push('enChoice');
  const kind = kinds[(Math.random()*kinds.length)|0];
  if(kind==='listen') return buildListenQuestion(idx);
  if(kind==='spell') return buildSpellQuestion(idx);
  if(kind==='enChoice') return buildEnChoiceQuestion(idx);
  return buildWordQuestion(idx);
}

// Listen: hear the word, pick the correct English spelling
function buildListenQuestion(idx){
  const w = WORDS[idx];
  const pool = activeWordList();
  const opts = new Set([idx]);
  let guard=0;
  while(opts.size<4 && guard<200){
    const j = pool[(Math.random()*pool.length)|0];
    if(!opts.has(j)) opts.add(j);
    guard++;
  }
  while(opts.size<4){
    const j=(Math.random()*WORDS.length)|0;
    if(!opts.has(j)) opts.add(j);
  }
  const optArr=[...opts];
  for(let i=optArr.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [optArr[i],optArr[j]]=[optArr[j],optArr[i]]; }
  return {
    type:'word', subtype:'listen', idx,
    prompt: w.w, phon:w.p, pos:w.pos,
    correctCn: w.cn,
    correctEn: w.w,
    options: optArr.map(j=>WORDS[j].w),
    correctIndex: optArr.indexOf(idx),
    reward: 1, example:w.en, exampleCn:w.cn2,
  };
}

// Spell: given Chinese + phonetic, type the English word

// Wrong-book scope: drill only persistent wrong words (pick English meaning)
function pickWrongBookQuestion(){
  if(!wrongBook.length) return null;
  const item = wrongBook[(Math.random()*wrongBook.length)|0];
  return buildWrongBookQuestion(item);
}
function buildWrongBookQuestion(item){
  // build 4 Chinese options: correct + 3 random from word bank (built-in + custom)
  const correctCn = item.cn || '';
  const allCn = [];
  for(const w of WORDS) if(w.cn && w.cn!==correctCn) allCn.push(w.cn);
  for(const w of customWords) if(w.cn && w.cn!==correctCn) allCn.push(w.cn);
  // shuffle source pool
  for(let i=allCn.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [allCn[i],allCn[j]]=[allCn[j],allCn[i]]; }
  const others=[];
  for(const c of allCn){ if(others.length>=3) break; if(!others.includes(c)) others.push(c); }
  const opts=[correctCn, ...others];
  for(let i=opts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return {
    type:'wrongbook',
    prompt: item.en,
    phon:'', pos:'',
    correctCn: correctCn,
    correctEn: item.en,
    options: opts,
    correctIndex: opts.indexOf(correctCn),
    reward: 1, example:'', exampleCn:'',
  };
}

// Pick from the independent 高考 high-frequency list (938 words, shuffled order)
function pickGaokaoQuestion(){
  if(!GAOKAO.length) return null;
  // re-test this run's wrong gaokao words first (45% chance), else random
  if(gaokaoWrong.length && Math.random()<0.45){
    const gi = gaokaoWrong[(Math.random()*gaokaoWrong.length)|0];
    return buildGaokaoQuestion(gi);
  }
  const gi = (Math.random()*GAOKAO.length)|0;
  return buildGaokaoQuestion(gi);
}
function buildGaokaoQuestion(gi){
  const w = GAOKAO[gi];
  // build 4 Chinese options from the gaokao bank
  const opts = new Set([gi]);
  let guard=0;
  while(opts.size<4 && guard<300 && GAOKAO.length>1){
    const j=(Math.random()*GAOKAO.length)|0;
    if(j!==gi) opts.add(j);
    guard++;
  }
  const optArr = [...opts];
  for(let i=optArr.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [optArr[i],optArr[j]]=[optArr[j],optArr[i]]; }
  return {
    type:'gaokao',
    gi,
    idx:-1,
    prompt: w.w,
    phon: w.p,
    pos: w.pos,
    correctCn: w.cn,
    correctEn: w.w,
    options: optArr.map(j=>GAOKAO[j].cn),
    correctIndex: optArr.indexOf(gi),
    reward: 1,
    example:'', exampleCn:'',
  };
}

// Pick from custom word bank; re-test wrong ones first; mark exhausted when all done
function pickCustomQuestion(){
  if(!customWords.length) return null;
  // re-test wrong answers first
  while(customWrong.length){
    const ci = customWrong.shift();
    if(ci>=0 && ci<customWords.length && !customDone.has(ci)){
      return buildCustomQuestion(ci);
    }
  }
  // find next not-yet-done custom word
  for(let ci=0; ci<customWords.length; ci++){
    if(!customDone.has(ci)) return buildCustomQuestion(ci);
  }
  // all words answered correctly => exhausted
  return null;
}

function buildCustomQuestion(ci){
  const w = customWords[ci];
  // build 4 Chinese options from the custom bank
  const opts = new Set([ci]);
  let guard=0;
  while(opts.size<4 && guard<300 && customWords.length>1){
    const j=(Math.random()*customWords.length)|0;
    if(j!==ci) opts.add(j);
    guard++;
  }
  const optArr = [...opts];
  for(let i=optArr.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [optArr[i],optArr[j]]=[optArr[j],optArr[i]]; }
  return {
    type:'custom',
    ci,
    prompt: w.w,
    phon:'',
    pos:'',
    correctCn: w.cn,
    options: optArr.map(j=>customWords[j].cn),
    correctIndex: optArr.indexOf(ci),
    reward: 1,
    example:'',
    exampleCn:'',
  };
}

function buildWordQuestion(idx){
  const w = WORDS[idx];
  // Generate 4 options from cn
  const pool = activeWordList();
  const opts = new Set([idx]);
  let guard=0;
  while(opts.size<4 && guard<200){
    const j = pool[(Math.random()*pool.length)|0];
    if(!opts.has(j)) opts.add(j);
    guard++;
  }
  // ensure 4: fill with any
  let allIdx = [];
  while(opts.size<4){
    const j=(Math.random()*WORDS.length)|0;
    if(!opts.has(j)) opts.add(j);
  }
  const optArr = [...opts];
  // shuffle
  for(let i=optArr.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [optArr[i],optArr[j]]=[optArr[j],optArr[i]]; }
  const correct = optArr.indexOf(idx);
  return {
    type:'word',
    idx,
    prompt: w.w,
    phon: w.p,
    pos: w.pos,
    correctCn: w.cn,
    options: optArr.map(j=>WORDS[j].cn),
    correctIndex: correct,
    reward: 1,
    example: w.en,
    exampleCn: w.cn2,
  };
}

function buildSentenceQuestion(){
  const s = SENTENCES[(Math.random()*SENTENCES.length)|0];
  const others = [];
  const pool = SENTENCES;
  let guard=0;
  while(others.length<3 && guard<200){
    const j = (Math.random()*pool.length)|0;
    if(pool[j].cn!==s.cn && !others.includes(pool[j].cn)) others.push(pool[j].cn);
    guard++;
  }
  const opts = [s.cn, ...others];
  for(let i=opts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const correct = opts.indexOf(s.cn);
  return {
    type:'sentence',
    idx:-1,
    prompt: s.en,
    phon:'',
    pos:'',
    correctCn: s.cn,
    options: opts,
    correctIndex: correct,
    reward: 2,
    example:'',
    exampleCn:'',
  };
}

  /* ---- Word pronunciation ----
   * Multi-layer strategy for maximum compatibility (incl. Win7 / old WebKit):
   *  1) Online TTS audio (Google Translate TTS) via <audio> — clear, standard,

   *  2) Fallback to speechSynthesis when online audio fails / offline.
   * Returns true if a pronunciation path was attempted.

  _ttsCache:{},
  _ttsPlaying:null,
  speak(text, opts){
    const t=String(text||'').trim();
    if(!t) return false;
    opts=opts||{};

    try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
    if(this._ttsPlaying){ try{ this._ttsPlaying.pause(); }catch(e){} this._ttsPlaying=null; }
    // Build online TTS URL (English). Word or short sentence both work.
    const key=t.toLowerCase();
    if(!this._ttsCache[key]){
      const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q='+encodeURIComponent(t);
      this._ttsCache[key]=new Audio(url);
      this._ttsCache[key].preload='auto';
    }
    const a=this._ttsCache[key];
    this._ttsPlaying=a;
    let handled=false;

      if(handled) return; handled=true;

  _musicLoop(){
    if(!this.musicOn||!this.ctx) return;
    try{
      const T=this.ctx.currentTime+0.06;
      const beat=0.42;                       // lively ~143 BPM
      // 4 bars: C - G - Am - F  (bright major progression)
      const bars=[
        {root:130.81, pad:[261.63,329.63,392.00], mel:[523.25,587.33,659.25,523.25,783.99,659.25,587.33,523.25]},
        {root:98.00,  pad:[196.00,246.94,293.66], mel:[493.88,440.00,392.00,493.88,587.33,493.88,440.00,392.00]},
        {root:110.00, pad:[220.00,261.63,329.63], mel:[440.00,523.25,659.25,523.25,659.25,587.33,523.25,440.00]},
        {root:87.31,  pad:[174.61,220.00,261.63], mel:[349.23,392.00,440.00,349.23,523.25,440.00,392.00,349.23]},

        const ch=bars[bar], barT=T+bar*4*beat;

        this._toneAt(ch.root, beat*1.5, 'triangle', 0.075, barT);
        this._toneAt(ch.root, beat*0.7, 'triangle', 0.05, barT+beat*2);
        // gentle pad
        for(const f of ch.pad) this._toneAt(f, beat*3.4, 'sine', 0.026, barT);
        // bouncy melody (eighth notes)
        for(let i=0;i<8;i++){
          const v=(i%2===0)?0.06:0.042;
          this._toneAt(ch.mel[i], beat*0.4, 'triangle', v, barT+i*beat*0.5);

        // light hi-hat on off-beats
        for(let i=0;i<4;i++) this._noiseAt(0.035, 0.018, barT+beat*i+beat*0.5);

        this._toneAt(64, 0.1, 'sine', 0.05, barT);

  _tone(f,d,t,v){ this._toneAt(f,d,t,v,this.ctx.currentTime); },

    }catch(e){}

let playSeed=1;
function hash2(x,y){
  let h=(Math.imul(x,0x27d4eb2d)^Math.imul(y,0x165667b1)^playSeed)|0;
  h=Math.imul(h^(h>>>15),0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,y,s,salt){
  const gx=x/s, gy=y/s, x0=Math.floor(gx), y0=Math.floor(gy), fx=gx-x0, fy=gy-y0;
  const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy), ox=salt*7919, oy=-salt*104729;
  const a=hash2(x0+ox,y0+oy), b=hash2(x0+1+ox,y0+oy), c=hash2(x0+ox,y0+1+oy), d=hash2(x0+1+ox,y0+1+oy);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
function gameWall(c,r){
  if(c*c+r*r<CLEAR*CLEAR) return false;
  const v=vnoise(c,r,NS1,1)*0.6+vnoise(c,r,NS2,2)*0.4;

}

let wallTiles=[], floorPattern=null;

/* ---------------- Collision ---------------- */
function circleWallHit(x,y,r){
  const c0=Math.floor((x-r)/CELL), c1=Math.floor((x+r)/CELL);
  const r0=Math.floor((y-r)/CELL), r1=Math.floor((y+r)/CELL);
  let best=null;
  for(let gr=r0;gr<=r1;gr++) for(let gc=c0;gc<=c1;gc++){
    if(!gameWall(gc,gr)) continue;
    const px=clamp(x,gc*CELL,gc*CELL+CELL), py=clamp(y,gr*CELL,gr*CELL+CELL);
    const dx=x-px, dy=y-py, d2=dx*dx+dy*dy;
    if(d2<r*r&&(!best||d2<best.d2)) best={d2:d2,dx:dx,dy:dy,px:px,py:py};
  }
  return best;
}
function resolveCircle(e){
  const hit=circleWallHit(e.x,e.y,e.r);
  if(!hit) return false;
  const d=Math.sqrt(hit.d2);
  if(d<1e-4){
    const gc=Math.floor(e.x/CELL), gr=Math.floor(e.y/CELL);
    let bx=gc,by=gr,bd=1e18;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      if(gameWall(gc+dc,gr+dr)) continue;
      const cx=(gc+dc)*CELL+CELL/2, cy=(gr+dr)*CELL+CELL/2;
      const dd=(cx-e.x)*(cx-e.x)+(cy-e.y)*(cy-e.y);
      if(dd<bd){ bd=dd; bx=cx; by=cy; }
    }
    e.x=bx; e.y=by; return true;
  }
  const nx=hit.dx/d, ny=hit.dy/d;
  e.x=hit.px+nx*(e.r+0.4); e.y=hit.py+ny*(e.r+0.4);
  return true;
}
function moveWithCollision(e,dx,dy){ e.x+=dx; e.y+=dy; return resolveCircle(e); }
function reflectBullet(b){
  const hit=circleWallHit(b.x,b.y,b.r);
  if(!hit) return false;
  let d=Math.sqrt(hit.d2), nx, ny;
  if(d<1e-4){ const sp=Math.hypot(b.vx,b.vy)||1; nx=-b.vx/sp; ny=-b.vy/sp; }
  else { nx=hit.dx/d; ny=hit.dy/d; }
  b.x=hit.px+nx*(b.r+0.5); b.y=hit.py+ny*(b.r+0.5);
  const dot=b.vx*nx+b.vy*ny;
  if(dot<0){ b.vx-=2*dot*nx; b.vy-=2*dot*ny; }
  return true;
}
function rayWallDist(x,y,ang){
  const dx=Math.cos(ang)*6, dy=Math.sin(ang)*6;
  let cx=x, cy=y;
  for(let i=0;i<150;i++){
    cx+=dx; cy+=dy;
    if(gameWall(Math.floor(cx/CELL),Math.floor(cy/CELL))) return i*6;
  }
  return 900;
}
function losClear(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0), n=Math.ceil(d/14);
  for(let i=1;i<n;i++){
    const t=i/n;
    if(gameWall(Math.floor((x0+(x1-x0)*t)/CELL),Math.floor((y0+(y1-y0)*t)/CELL))) return false;
  }
  return true;
}

/* ---------------- Flow field ---------------- */
const FLOW_R=20, FLOW_S=FLOW_R*2+1;
const flowArr=new Int16Array(FLOW_S*FLOW_S);
const flowQ=new Int32Array(FLOW_S*FLOW_S);
let flow=null;
function computeFlow(){
  const pc=Math.floor(player.x/CELL), pr=Math.floor(player.y/CELL);
  flowArr.fill(-1); flow=flowArr;
  if(gameWall(pc,pr)) return;
  const start=FLOW_R*FLOW_S+FLOW_R;
  flowArr[start]=0;
  let head=0, tail=0;
  flowQ[tail++]=start;
  while(head<tail){
    const idx=flowQ[head++], r=Math.floor(idx/FLOW_S), c=idx%FLOW_S, d=flowArr[idx];
    if(d>=24) continue;
    for(let k=0;k<4;k++){
      const nc=c+(k===0?1:k===1?-1:0), nr=r+(k===2?1:k===3?-1:0);
      if(nc<0||nc>=FLOW_S||nr<0||nr>=FLOW_S) continue;
      const ni=nr*FLOW_S+nc;
      if(flowArr[ni]!==-1) continue;
      if(gameWall(pc+nc-FLOW_R,pr+nr-FLOW_R)) continue;
      flowArr[ni]=d+1; flowQ[tail++]=ni;
    }
  }
}
function flowDirAt(wx,wy){
  if(!flow) return null;
  const pc=Math.floor(player.x/CELL), pr=Math.floor(player.y/CELL);
  const c=Math.floor(wx/CELL)-pc+FLOW_R, r=Math.floor(wy/CELL)-pr+FLOW_R;
  if(c<0||c>=FLOW_S||r<0||r>=FLOW_S) return null;
  const d0=flow[r*FLOW_S+c];
  if(d0<=0) return null;
  let bd=d0, bc=-1, br=-1;
  for(let k=0;k<4;k++){
    const nc=c+(k===0?1:k===1?-1:0), nr=r+(k===2?1:k===3?-1:0);
    if(nc<0||nc>=FLOW_S||nr<0||nr>=FLOW_S) continue;
    const d=flow[nr*FLOW_S+nc];
    if(d>=0&&d<bd){ bd=d; bc=nc; br=nr; }
  }
  if(bc<0) return null;
  return Math.atan2((pr+br-FLOW_R+0.5)*CELL-wy,(pc+bc-FLOW_R+0.5)*CELL-wx);
}
function steerClear(e,desired){
  const offs=[0,0.5,-0.5,1.0,-1.0,1.6,-1.6,2.4,-2.4];
  for(let i=0;i<offs.length;i++){
    const a=desired+offs[i];
    const px=e.x+Math.cos(a)*(e.r+20), py=e.y+Math.sin(a)*(e.r+20);
    if(!gameWall(Math.floor(px/CELL),Math.floor(py/CELL))) return a;
  }
  return desired;
}

/* ---------------- Unstuck ---------------- */
function unstuckPlayer(){
  const pc=Math.floor(player.x/CELL), pr=Math.floor(player.y/CELL);
  for(let rad=1;rad<=14;rad++){
    for(let dr=-rad;dr<=rad;dr++) for(let dc=-rad;dc<=rad;dc++){
      if(Math.max(Math.abs(dr),Math.abs(dc))!==rad) continue;
      const c=pc+dc, r2=pr+dr;
      if(gameWall(c,r2)) continue;
      const cx=(c+0.5)*CELL, cy=(r2+0.5)*CELL;
      if(circleWallHit(cx,cy,player.r+1)) continue;
      player.x=cx; player.y=cy;
      rings.push(mkRing(cx,cy,4,40,0.5,'rgba(125,255,200,'));
      spawnSparks(cx,cy,8,'#7dffc8',130);
      return true;
    }
  }
  player.x=CELL/2; player.y=CELL/2;
  return true;
}

/* ---------------- Enemies ---------------- */
function makeEnemy(type,x,y){
  const th=threat(), sc=spdScale();
  const e={uid:++EUID,type:type,x:x,y:y,kx:0,ky:0,flash:0,dead:false,phase:rand(0,TAU),alert:0,
           track:rand(0,20),hull:rand(0,TAU),wanderA:rand(0,TAU),wanderT:0,
           recoil:0,muzzle:0,windup:0,aimAng:rand(0,TAU),spawnT:0.4,
           warnD:600,warnT:-1,see:false,seeT:rand(0,0.18)};
  if(type==='chaser') return Object.assign(e,{r:13,hp:1,speed:Math.min(185,(95+th*5)*sc)});
  if(type==='gunner') return Object.assign(e,{r:14,hp:2,speed:46*sc,shootT:rand(1.6,3.2),period:Math.max(1.5,3.0-th*0.15)});
  return Object.assign(e,{r:20,hp:4,maxHp:4,speed:54*sc,shootT:rand(3,5),period:rand(4,5.5)});
}
function pickType(th){
  const wC=10, wG=Math.min(7,1+th), wH=th>=3?Math.min(8,(th-2)*2.5):0;
  let r=rand(0,wC+wG+wH);
  if((r-=wC)<0) return 'chaser';
  if((r-=wG)<0) return 'gunner';
  return 'heavy';
}
function trySpawnEnemy(){
  for(let t=0;t<30;t++){
    const a=rand(0,TAU);
    const d=rand(SP_MIN,SP_MAX);
    const x=player.x+Math.cos(a)*d, y=player.y+Math.sin(a)*d;
    const cx=Math.floor(x/CELL), cy=Math.floor(y/CELL);
    if(gameWall(cx,cy)) continue;
    let open=0;
    for(let k=0;k<4;k++){
      const mv=[[1,0],[-1,0],[0,1],[0,-1]][k];
      if(!gameWall(cx+mv[0],cy+mv[1])) open++;
    }
    if(open<2) continue;
    enemies.push(makeEnemy(pickType(threat()),x,y));
    rings.push(mkRing(x,y,4,42,0.5,'rgba(255,90,90,'));
    spawnSparks(x,y,6,'#ff8a8a',120);
    return true;
  }
  return false;
}
function regionEnemyCount(){
  const half=REGION_CELLS/2;
  const pc=player.x/CELL, pr=player.y/CELL;
  let n=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e.dead) continue;
    if(Math.abs(e.x/CELL-pc)<half&&Math.abs(e.y/CELL-pr)<half) n++;
  }
  return n;
}
function regionCapNow(){
  const lv=threat();
  return Math.min(5*lv, 30);
}
function updateSpawner(dt){
  if(spawnLock>0){ spawnLock-=dt; return; }
  spawnT-=dt;
  if(spawnT>0) return;
  spawnT=1.15;
  if(regionEnemyCount()>=regionCapNow()) return;
  if(!trySpawnEnemy()) spawnT=1.5;
}

/* ---------------- Combat ---------------- */
function currentWeapon(){
  return WEAPONS[profile.curWeapon] || WEAPONS.normal;
}
function ownedWeapons(){
  const list=['normal'];
  if(profile.pierceUnlock) list.push('pierce');
  if(profile.homingUnlock) list.push('homing');
  return list;
}
function cycleWeapon(dir){
  const list=ownedWeapons();
  if(list.length<=1) return;
  weaponIdx=(weaponIdx+dir+list.length)%list.length;
  profile.curWeapon=list[weaponIdx];
  saveProfile();
  toast('🔫 切换武器 · '+currentWeapon().name+' · '+ (dir>0?'下一把':'上一把'));
}
function fire(){
  if(state!=='playing'||paused) return;
  if(ammo<=0){
    player.cool=0.25;
    Sound.empty && Sound.empty();
    if(Sound.gate('noshell',1400)){
      showHint('💥 没有炮弹了！请按 <span class="key">空格键</span> 答题来补充炮弹');
    }
    return;
  }
  const wp=currentWeapon();
  ammo--;
  // fire-rate upgrade shortens cooldown by 6% per level
  const cd=wp.cooldown*(1-0.06*(profile.fireRateLv||0));
  player.cool=cd;
  player.coolMax=cd;
  player.muzzle=0.09; player.recoil=1;
  const a=player.turret, off=29;
  const sx=player.x+Math.cos(a)*off, sy=player.y+Math.sin(a)*off;
  const dmg=wp.dmg + profile.dmgLv;
  // ricochet upgrade adds one extra bounce to every player shell
  const extraBounce = profile.ricochetUnlock ? 1 : 0;
  bullets.push({x:sx,y:sy,
    vx:Math.cos(a)*wp.speed, vy:Math.sin(a)*wp.speed,
    r:wp.pierce?B_R+1:B_R, maxB:(wp.pierce?B_BOUNCE+2:B_BOUNCE)+extraBounce,
    dmg:dmg, boomL:0, big:false,
    weapon:wp.pierce?'pierce':(wp.homing?'homing':'cannon'),
    pierce:wp.pierce, homing:wp.homing, hitIds:(wp.pierce?new Set():null),
    color:wp.color,
    owner:player, fromPlayer:true,
    bounces:0, life:wp.pierce?B_LIFE+1:B_LIFE, trail:[], armed:false, dead:false});
  spawnSparks(sx,sy,wp.pierce?6:4,wp.color,130);
  shake=Math.max(shake,wp.pierce?2:1.5);
  if(wp.homing) Sound.beep(500,.08,'triangle',.1,100);
  else if(wp.pierce) Sound.beep(300,.08,'square',.12,-80);
  else Sound.shoot();
}
function enemyFire(e){
  const big=e.type==='heavy';
  const R=big?HB_R:EB_R, SP=big?HB_SPD:EB_SPD;
  const a=e.aimAng;
  let sx=e.x+Math.cos(a)*(e.r+8), sy=e.y+Math.sin(a)*(e.r+8);
  if(circleWallHit(sx,sy,R)){ sx=e.x; sy=e.y; }
  bullets.push({x:sx,y:sy,vx:Math.cos(a)*SP,vy:Math.sin(a)*SP,
                r:R,maxB:B_BOUNCE,dmg:1,boomL:0,big:big,
                weapon:'enemy',pierce:false,homing:false,hitIds:null,
                owner:e,fromPlayer:false,
                bounces:0,life:B_LIFE,trail:[],armed:false,dead:false});
  spawnSparks(sx,sy,big?8:4,big?'#e2a6ff':'#ffb27a',big?150:100);
  Sound.eshoot();
}
function shatter(b,quiet){
  if(b.dead) return;
  b.dead=true;
  spawnSparks(b.x,b.y,quiet?5:8,b.fromPlayer?'#9fe8ff':(b.big?'#e2a6ff':'#ffc9a0'),140);
}
function hitUnits(b){
  const canHitP=(b.owner!==player)||b.armed;
  if(canHitP&&player.inv<=0&&state==='playing'){
    const dx=b.x-player.x, dy=b.y-player.y, rs=b.r+player.r;
    if(dx*dx+dy*dy<rs*rs){ hurtPlayer(); shatter(b,false); return; }
  }
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e===b.owner||e.dead) continue;
    // piercing shells hit each enemy only once
    if(b.hitIds && b.hitIds.has(e.uid)) continue;
    const dx=b.x-e.x, dy=b.y-e.y, rs=b.r+e.r;
    if(dx*dx+dy*dy<rs*rs){
      if(b.hitIds) b.hitIds.add(e.uid);
      damageEnemy(e,b);
      if(!b.pierce) shatter(b,false);
      return;
    }
  }
}
function damageEnemy(e,b){
  e.hp-=(b.dmg||1); e.flash=0.12;
  const l=Math.hypot(b.vx,b.vy)||1, kb=90+b.r*8;
  e.kx+=b.vx/l*kb; e.ky+=b.vy/l*kb;
  if(e.hp<=0) killEnemy(e);
  else { spawnSparks(e.x,e.y,5,'#ffffff',110); Sound.clang(); }
}
function killEnemy(e){
  e.dead=true; kills++;
  let pts=e.type==='heavy'?3:(e.type==='gunner'?2:1);   // coins earned directly
  if(profile.magnetUnlock) pts=Math.round(pts*1.5);     // coin boost +50%
  score+=pts; runCoins+=pts;
  floats.push({x:e.x,y:e.y-e.r-6,text:'+'+pts+'🪙',color:'#ffd166',big:e.type==='heavy',life:1});
  decals.push({x:e.x,y:e.y,r:e.r*rand(0.85,1.15),a:0.42});
  if(decals.length>50) decals.shift();
  spawnExplosion(e.x,e.y);
  rings.push(mkRing(e.x,e.y,e.r*0.4,e.r*3.2,0.5,'rgba(255,120,80,'));
  shake=Math.max(shake,e.type==='heavy'?7:4.5); Sound.boom();
}
// Nuke: hold F for 2s to detonate, destroying all enemies within a 50x50-cell radius.
const NUKE_RADIUS = 50*CELL;   // 50 cells of 48px = 2400px radius
function detonateNuke(){
  if(profile.nukeStock<=0) return;
  if(state!=='playing'||paused) return;
  profile.nukeStock--;
  saveProfile();
  nukeFlash=1.2;
  const cx=player.x, cy=player.y;
  const R=NUKE_RADIUS;
  let destroyed=0;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead) continue;
    if((e.x-cx)*(e.x-cx)+(e.y-cy)*(e.y-cy) <= R*R){
      killEnemy(e);
      destroyed++;
    }
  }
  // massive visual + shake
  shake=Math.max(shake,22);
  rings.push(mkRing(cx,cy,20,R,1.1,'rgba(255,210,120,'));
  rings.push(mkRing(cx,cy,10,R*0.7,0.9,'rgba(255,140,60,'));
  spawnExplosion(cx,cy);
  spawnSparks(cx,cy,60,'#ffd166',420);
  spawnSparks(cx,cy,40,'#ff7a3d',340);
  Sound.boom();
  setTimeout(()=>Sound.boom(),120);
  toast('☢ 核弹引爆！摧毁 '+destroyed+' 辆坦克 · NUKE!');
}
function updateNuke(dt){
  // charge progress handled via keydown/keyup; visual handled in drawNukeCharge()
  if(nukeFlash>0) nukeFlash=Math.max(0,nukeFlash-dt);
}
// Shield: absorbs one hit if available
let shieldActive=false;   // current-run shield (from consumable stock)
function tryConsumeShield(){
  if(shieldActive){
    shieldActive=false;
    // shield break effect
    spawnSparks(player.x,player.y,16,'#7dffc8',200);
    rings.push(mkRing(player.x,player.y,8,64,0.5,'rgba(125,255,200,'));
    Sound.heal();
    player.inv=INV;   // brief invulnerability after shield break
    toast('🛡 护盾抵挡了一次伤害 · Shield absorbed');
    return true;
  }
  return false;
}
function hurtPlayer(){
  if(player.inv>0||state!=='playing') return;
  if(tryConsumeShield()) return;
  hp-=1; player.inv=INV; redFlash=0.55; shake=7;
  spawnSparks(player.x,player.y,12,'#ff6b6b',190);
  rings.push(mkRing(player.x,player.y,6,46,0.4,'rgba(255,90,90,'));
  Sound.hurt();
  if(hp<=0){
    // Revive chance: if this run still has revives left, enter the revive challenge
    // instead of ending the game immediately.
    if(!reviveActive && reviveCount<REVIVE_MAX){
      startRevive();
    } else {
      doGameOver();
    }
  }
}
function startRevive(){
  reviveActive=true;
  reviveProgress=0;
  hp=0;                           // stay at 0 until the challenge is won
  paused=true;                    // freeze gameplay while answering
  state='playing';                // keep 'playing' so quiz flow works
  spawnExplosion(player.x,player.y);
  shake=10; redFlash=0.7;
  Sound.lose();
  // present the revive challenge via the normal quiz modal
  quizTrigger='revive';
  quizQuestion = pickReviveQuestion();
  quizAnswered=false;
  quizEl.classList.add('show');
  renderQuiz();
}
// Revive questions always draw from the built-in WORDS pool (never empty),
// independent of the current scope, so the challenge can never soft-lock.
function pickReviveQuestion(){
  const idx=(Math.random()*WORDS.length)|0;
  return buildTypedWordQuestion(idx);
}
function reviveSucceed(){
  reviveCount++;
  reviveActive=false;
  reviveProgress=0;
  hp=hpMax;                        // 满血复活 (full heal)
  greenFlash=0.9;
  paused=false;
  spawnSparks(player.x,player.y,26,'#7dffc8',240);
  rings.push(mkRing(player.x,player.y,10,120,0.8,'rgba(125,255,200,'));
  rings.push(mkRing(player.x,player.y,6,80,0.6,'rgba(255,215,0,'));
  Sound.heal();
  toast('💫 复活成功！满血回归！(剩余复活 '+(REVIVE_MAX-reviveCount)+' 次) · REVIVED!');
}
function doGameOver(reason){
  state='gameover'; overT=1.1; overShown=false; overReason=reason||'被击毁 · DESTROYED';
  spawnExplosion(player.x,player.y);
  rings.push(mkRing(player.x,player.y,8,110,0.7,'rgba(120,225,255,'));
  shake=12; redFlash=0.8; Sound.lose();
  mouse.down=false;
  Sound.stopMusic();
  if(Math.round(score)>best){ best=Math.round(score); saveLS('wt_best',best); }
  settleCoins();
}
/* Credit this run's coins into profile (local, persists) */
function settleCoins(){
  const earned = Math.floor(runCoins);
  if(earned<=0) return;
  profile.coins += earned;
  saveProfile();
  runCoins = 0;
}

/* ---------------- Quiz (word exam) ---------------- */
let quizEl, quizPanelEl;
let pendingQuiz=null;       // enemy waiting
let quizQuestion=null;
let quizAnswered=false;
let quizEnemy=null;         // the enemy that triggered quiz (locked)
let quizTrigger='voluntary'; // 'voluntary' (space, out of shells) | 'heal' (touched heal pack)
let quizCooldown=0;          // seconds until next quiz allowed (>= QUIZ_MIN_INTERVAL between quizzes)

// Unified "answer to reload" entry (bound to SPACE and touch answer button).
function tryOpenQuiz(){
  if(state!=='playing'||quizEl.classList.contains('show')||paused) return;
  if(ammo>0){
    showHint('🔫 你还有炮弹！请先开炮，<span class="key">没炮弹时</span>再按空格答题补充');
    return;
  }
  if(quizCooldown>0){
    showHint('⏳ 答题冷却中，还需 <span class="key">'+Math.ceil(quizCooldown)+' 秒</span>，继续战斗吧！');
    return;
  }
  quizTrigger='voluntary';
  paused=true;
  openQuiz();
}

function openQuiz(){
  quizQuestion = pickQuestion();
  if(!quizQuestion){
    // exhausted scope => switch back to "all" and notify
    if(scope==='custom'){
      toast('✅ 自定义词库词已用尽，已切换回「全部」词库 · Custom bank exhausted, back to All');
      scope='all';
      saveLS('wt_scope', scope);
      buildRangeGrid();
    } else if(scope==='wrongbook'){
      toast('🎉 错题本已清空，太棒了！已切换回「全部」词库 · Wrong book cleared, back to All');
      scope='all';
      saveLS('wt_scope', scope);
      buildRangeGrid();
    }
    closeQuiz();
    if(state==='playing') paused=false;
    return;
  }
  quizAnswered=false;
  quizEl.classList.add('show');
  renderQuiz();
}
function closeQuiz(){
  quizEl.classList.remove('show');
  quizQuestion=null;
  quizAnswered=false;
  quizEnemy=null;
}
function renderQuiz(){
  const q=quizQuestion;
  const isSentence = q.type==='sentence';
  const isHeal = quizTrigger==='heal';
  const sub = q.subtype || 'meaning';
  const isListen = sub==='listen';
  const isSpell = sub==='spell';
  const isEnChoice = sub==='enChoice';
  const isWrongBook = q.type==='wrongbook';
  const isGaokao = q.type==='gaokao';
  const isRevive = quizTrigger==='revive';
  let html='';
  // tag
  if(isRevive){
    html += '<div class="quiz-tag revive">💫 复活挑战 · 连续答对 10 题复活（'+reviveProgress+'/'+REVIVE_NEED+'）</div>';
  } else if(isHeal){
    html += '<div class="quiz-tag danger">❤ 血包挑战 · HEAL PACK</div>';

    html += '<div class="quiz-tag sentence">句子翻译 · SENTENCE</div>';
  } else if(isListen){
    html += '<div class="quiz-tag listen">👂 听力 · LISTENING</div>';
  } else if(isSpell){
    html += '<div class="quiz-tag spell">✍ 拼写 · SPELLING</div>';

    html += '<div class="quiz-tag enc">中译英 · CN→EN</div>';

    html += '<div class="quiz-tag wrongbook">📕 错题本 · REVIEW</div>';

    html += '<div class="quiz-tag gaokao">🎓 高考高频词 · GAOKAO</div>';

    html += '<div class="quiz-tag">单词考核 · VOCABULARY</div>';
  }

    html += '<div class="quiz-sentence-en" id="quizSpeakText">'+escapeHtml(q.prompt)+'</div>';
  } else if(isListen){
    html += '<div class="quiz-word listen-word" id="quizSpeakText">🔊</div>';
    html += '<div class="quiz-phon">'+escapeHtml(q.phon||'')+'</div>';
    html += '<div class="quiz-listen-hint">点击喇叭听发音，选出对应的单词 · Tap to listen, pick the word</div>';
  } else if(isSpell){
    html += '<div class="quiz-word" id="quizSpeakText">'+escapeHtml(q.correctCn)+'</div>';
    html += '<div class="quiz-phon">'+escapeHtml(q.phon||'')+'</div>';
    html += '<div class="quiz-listen-hint">根据中文与音标，拼出英文单词 · Spell the English word</div>';
  } else if(isEnChoice || isWrongBook){
    html += '<div class="quiz-word" id="quizSpeakText">'+escapeHtml(q.correctCn)+'</div>';

  // reward / stakes note

    html += '<div class="quiz-reward danger-note">连续答对 <b>'+REVIVE_NEED+' 题</b>即可<b>满血复活</b> · 答错任意一题则<b>立即结束游戏</b>！<br><span class="sub">Answer '+REVIVE_NEED+' in a row to revive · one wrong answer = game over</span></div>';
  } else if(isHeal){
    html += '<div class="quiz-reward danger-note">答对可<b>回复 1 点生命</b> · 答错则<b>血包消失</b>！<br><span class="sub">Correct = +1 HP · Wrong = pack vanishes</span></div>';
  } else if(isSentence){
    html += '<div class="quiz-reward">翻译正确可获得 <b>+2 炮弹</b> + 连击加成 · Translate correctly for +2 shells + combo bonus</div>';

  } else {
    html += '<div class="quiz-reward">答对获得 <b>+1 炮弹</b> + 连击加成 · Correct answer = +1 shell + combo bonus</div>';
  }
  // question input area (options vs. typing)
  if(isSpell){
    // spell = always typing English
    html += '<input type="text" class="type-input" id="quizTypeInput" placeholder="输入英文单词 · Type the English word..." autocomplete="off" autocomplete="false">';

  // listening question: auto-play pronunciation once shown
  if(sub==='listen'){ setTimeout(doSpeak, 250); }
  const subBtn=quizPanelEl.querySelector('#quizTypeSubmit');
  if(subBtn) subBtn.addEventListener('click',()=>{

  const inp=quizPanelEl.querySelector('#quizTypeInput');

      if(e.code==='Enter'||e.code==='NumpadEnter') answerQuizText(inp.value);
    });
    setTimeout(()=>inp.focus(),50);
  }
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function answerQuiz(optIndex){
  if(quizAnswered) return;
  quizAnswered=true;
  const q=quizQuestion;
  const correct = optIndex===q.correctIndex;
  handleQuizResult(correct);
  // mark buttons
  quizPanelEl.querySelectorAll('[data-opt]').forEach(b=>{
    const i=+b.getAttribute('data-opt');
    if(i===q.correctIndex) b.classList.add('correct');
    else if(i===optIndex) b.classList.add('wrong');

}
function answerQuizText(text){
  if(quizAnswered) return;
  const q=quizQuestion;
  const val=text.trim();
  if(!val) return;
  quizAnswered=true;
  // spell / enChoice / wrongbook typed answers compare English; meaning compares Chinese
  const typedEnglish = (q.subtype==='spell' || q.subtype==='enChoice' || q.type==='wrongbook');
  const correct = typedEnglish ? isEnMatch(q.correctEn, val) : isCnMatch(q.correctCn, val);
  handleQuizResult(correct);
}
function normalizeEn(s){
  return String(s).toLowerCase().replace(/[^a-z']/g,'');
}
// Match typed English against the correct word (allow minor case/punctuation; must be close)
function isEnMatch(correct, user){
  const c = normalizeEn(correct);
  const u = normalizeEn(user);
  if(!c || !u) return false;
  if(c === u) return true;
  // tolerate common typos via similarity: Levenshtein distance <= 1 for short, <=2 for longer
  const d = levenshtein(c, u);
  const limit = c.length>=7 ? 2 : 1;
  return d <= limit;
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=new Array(n+1);
  for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){
    let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return dp[n];
}
function normalizeCn(s){
  return String(s).replace(/[，。；、\s；;.，。、（）()]/g,'');
}
// Match: split correct answer into segments (by ; ； / ,)，user must match at least one full segment
function isCnMatch(correct, user){
  const c = normalizeCn(correct);
  const u = normalizeCn(user);
  if(!c || !u) return false;
  // exact match
  if(c === u) return true;
  // split correct into segments
  const segs = correct.split(/[；;、，,/]/).map(s=>normalizeCn(s)).filter(s=>s.length>0);
  // if user matches any full segment, accept
  for(const seg of segs){
    if(seg && seg===u) return true;
  }
  // if user is a substring of correct AND length >= 2 and covers >=50% of a segment
  for(const seg of segs){
    if(seg && u.length>=2 && seg.includes(u) && u.length/seg.length>=0.5) return true;
    if(seg && u.length>=2 && u.includes(seg) && seg.length/u.length>=0.5) return true;
  }
  // whole-string fuzzy: user length covers >=50% of correct (either direction)
  if(u.length>=2 && c.includes(u) && u.length/c.length>=0.5) return true;
  if(u.length>=2 && u.includes(c) && c.length/u.length>=0.5) return true;
  return false;
}
function handleQuizResult(correct){
  const q=quizQuestion;
  const fb=quizPanelEl.querySelector('#quizFeedback');
  const rev=quizPanelEl.querySelector('#quizAnswerReveal');
  const isHeal = quizTrigger==='heal';
  const isRevive = quizTrigger==='revive';
  // === Revive challenge branch (independent of normal scoring) ===
  if(isRevive && reviveActive){
    if(correct){
      reviveProgress++;
      if(reviveProgress>=REVIVE_NEED){
        // won the challenge => full revive
        fb.textContent='💫 复活成功！满血回归！';
        fb.className='quiz-feedback ok';
        Sound.correct();
        statRecord(q.correctEn||q.prompt, true);
        rev.innerHTML='正确答案：<b>'+escapeHtml(q.correctCn)+'</b><br>连续答对 <b>'+REVIVE_NEED+'</b> 题，成功复活！';
        reviveSucceed();
        const cont=document.createElement('button');
        cont.className='quiz-continue';
        cont.textContent='继续战斗 · RESUME ▶';
        cont.addEventListener('click',()=>{ closeQuiz(); resumeAfterQuiz(); });
        rev.after(cont);
      } else {
        // still going: show progress, next question
        fb.textContent='✓ 正确！复活进度 '+reviveProgress+' / '+REVIVE_NEED;
        fb.className='quiz-feedback ok';
        Sound.correct();
        statRecord(q.correctEn||q.prompt, true);
        rev.innerHTML='复活进度：<b>'+reviveProgress+' / '+REVIVE_NEED+'</b>（连续答对 '+REVIVE_NEED+' 题即可复活）';
        const cont=document.createElement('button');
        cont.className='quiz-continue';
        cont.textContent='下一题 · NEXT ▶';
        cont.addEventListener('click',()=>{ closeQuiz(); quizQuestion=pickReviveQuestion(); quizAnswered=false; quizEl.classList.add('show'); renderQuiz(); });
        rev.after(cont);
      }
    } else {
      // wrong during revive => game over immediately
      fb.textContent='✗ 答错了！复活失败…';
      fb.className='quiz-feedback no';
      Sound.wrong();
      statRecord(q.correctEn||q.prompt, false);
      rev.innerHTML='正确答案：<b>'+escapeHtml(q.correctCn)+'</b><br>复活挑战失败，游戏结束。';
      const cont=document.createElement('button');
      cont.className='quiz-continue';
      cont.textContent='结束游戏 · GAME OVER ▶';
      cont.addEventListener('click',()=>{
        closeQuiz();
        reviveActive=false; reviveProgress=0;
        paused=false;
        doGameOver('复活挑战失败 · REVIVE FAILED');
      });
      rev.after(cont);
    }
    return;
  }
  // learning stats + wrong book (word-based questions only, not sentences)
  const isWordQ = q.type==='word' || q.type==='custom' || q.type==='wrongbook' || q.type==='gaokao';
  const enWord = isWordQ ? (q.correctEn || q.prompt) : '';
  if(isWordQ && enWord){
    statRecord(enWord, correct);
    if(correct) wrongBookRemove(enWord);
    else wrongBookAdd(enWord, q.correctCn);
  } else if(!correct && q.type==='sentence'){
    // still count sentence attempts in totals (without a word key)
    stats.total++; saveStats();
  }
  if(correct){
    // streak counting (any correct word/sentence answer)
    correctStreak++;
    comboCount++;                       // shell reward = current consecutive-correct count
    const reward = profile.doubleShell ? q.reward*2 : q.reward;
    const bonus = comboCount;           // 子弹奖励数 = 连续答对题个数
    ammo=Math.min(AMMO_MAX, ammo+reward+bonus);
    let streakNote='';
    if(correctStreak>=3){
      correctStreak=0;
      if(hp<hpMax){
        hp++;
        greenFlash=0.7;
        spawnSparks(player.x,player.y,14,'#7dffc8',180);
        rings.push(mkRing(player.x,player.y,6,52,0.5,'rgba(125,255,200,'));
        Sound.heal();
        streakNote=' ❤ 连对3题，生命 +1！';
        toast('❤ 连对3题 · 生命 +1！ · Streak heal!');
      }else{
        streakNote=' ❤ 连对3题！生命已满';
      }
    }
    if(isHeal){
      // correct heal-pack answer => gain HP, pack consumed
      if(hp<hpMax){ hp++; greenFlash=0.7; Sound.heal(); }
      if(healEnemyRef!==null && healPacks[healEnemyRef]) healPacks[healEnemyRef].active=false;
      healPacks=healPacks.filter(p=>p.active);
      healPending=false; healEnemyRef=null;
      fb.textContent='✓ 答对了！生命 +1！'+streakNote;
    }else{
      fb.textContent='✓ 回答正确！+'+reward+' 炮弹（连对 '+comboCount+' 题，+'+bonus+'）'+streakNote;
    }
    fb.className='quiz-feedback ok';
    Sound.correct();
    // custom word answered correctly => mark done
    if(q.type==='custom'){
      customDone.add(q.ci);
      customWrong = customWrong.filter(x=>x!==q.ci);
    }
    // gaokao word answered correctly => clear from this run's wrong list
    if(q.type==='gaokao'){
      gaokaoWrong = gaokaoWrong.filter(x=>x!==q.gi);
    }
    // remove from wrong queue if present
    if(q.type==='word' && q.idx>=0) wrongQueue=wrongQueue.filter(x=>x!==q.idx);
  } else {
    correctStreak=0;   // break streak on wrong
    comboCount=0;      // 答错中断，连击重新计数
    if(isHeal){
      // wrong heal-pack answer => that pack vanishes
      if(healEnemyRef!==null && healPacks[healEnemyRef]) healPacks[healEnemyRef].active=false;
      healPacks=healPacks.filter(p=>p.active);
      healPending=false; healEnemyRef=null;
      spawnSparks(player.x,player.y,8,'#7dffc8',120);
      fb.textContent='✗ 答错了！血包消失了…';
    }else{
      fb.textContent='✗ 答错了！';
    }
    fb.className='quiz-feedback no';
    Sound.wrong();
    // custom word answered wrong => re-queue
    if(q.type==='custom'){
      if(!customWrong.includes(q.ci)) customWrong.push(q.ci);
    }
    // gaokao word answered wrong => re-queue this run
    if(q.type==='gaokao'){
      if(!gaokaoWrong.includes(q.gi)) gaokaoWrong.push(q.gi);
    }
    // add to wrong queue for re-test
    if(q.type==='word' && q.idx>=0 && !wrongQueue.includes(q.idx)) wrongQueue.push(q.idx);
  }
  // reveal correct answer (show both English and Chinese where relevant)
  let answerHtml='正确答案：<b>'+escapeHtml(q.correctCn)+'</b>';
  if(q.correctEn && q.correctEn!==q.prompt){
    answerHtml='正确答案：<b>'+escapeHtml(q.correctEn)+'</b> — '+escapeHtml(q.correctCn);
  }
  answerHtml += (q.type==='word'&&q.example ? '<br>例句 e.g. "'+escapeHtml(q.example)+'" — '+escapeHtml(q.exampleCn) : '');
  rev.innerHTML=answerHtml;
  // show continue button
  const cont=document.createElement('button');
  cont.className='quiz-continue';
  cont.textContent='继续 · CONTINUE ▶';
  cont.addEventListener('click',()=>{
    closeQuiz();
    resumeAfterQuiz();
  });
  rev.after(cont);
}
function resumeAfterQuiz(){

}
/* ---------------- Heal Packs (pickup quiz) ---------------- */
function spawnHealPack(){
  if(hp>=hpMax) return;              // no need to heal
  if(healPacks.length>=3) return;    // cap simultaneous packs
  for(let t=0;t<40;t++){
    const a=rand(0,TAU), d=rand(280,760);
    const x=player.x+Math.cos(a)*d, y=player.y+Math.sin(a)*d;
    const cx=Math.floor(x/CELL), cy=Math.floor(y/CELL);
    if(gameWall(cx,cy)) continue;
    // not too close to existing packs
    let ok=true;
    for(const p of healPacks){ if(p.active&&Math.hypot(p.x-x,p.y-y)<180) ok=false; }
    if(!ok) continue;
    healPacks.push({x:x,y:y,active:true});
    return;
  }
}
function updateHealPacks(dt){
  healPackT-=dt;
  if(healPackT<=0){
    healPackT=rand(14,24);
    if(hp<hpMax && Math.random()<0.6) spawnHealPack();
  }
  // expire far-away packs periodically (despawn)
  for(const p of healPacks){
    if(!p.active) continue;
    if(Math.hypot(p.x-player.x,p.y-player.y)>1400) p.active=false;
  }
  healPacks=healPacks.filter(p=>p.active);
}
function checkHealPackPickup(){

function updatePortals(dt){

function teleportPlayer(){

  player.x+=rand(-100,100); player.y+=rand(-100,100);
  resolveCircle(player);
}

/* ---------------- Input ---------------- */
function getMoveVec(){
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my--;
  if(keys.KeyS||keys.ArrowDown) my++;
  if(keys.KeyA||keys.ArrowLeft) mx--;
  if(keys.KeyD||keys.ArrowRight) mx++;
  const st=sticks.move;
  if(st){
    const dx=st.x-st.bx, dy=st.y-st.by, len=Math.hypot(dx,dy);
    if(len>8){ const k=Math.min(1,len/JOY_R); mx=dx/len*k; my=dy/len*k; }
  }
  const l=Math.hypot(mx,my);
  if(l>1){ mx/=l; my/=l; }
  return [mx,my];
}
function updateAimFire(){
  let aim=null, firing=false;
  const st=sticks.aim;
  if(st){
    const dx=st.x-st.bx, dy=st.y-st.by;
    if(Math.hypot(dx,dy)>DEAD){ aim=Math.atan2(dy,dx); firing=true; }
  }else if(!touchMode&&mouse.inside){
    const wx=cam.x+(mouse.x-W/2), wy=cam.y+(mouse.y-H/2);
    aim=Math.atan2(wy-player.y,wx-player.x);
    firing=mouse.down;
  }
  if(aim===null&&(lastMove[0]||lastMove[1])) aim=Math.atan2(lastMove[1],lastMove[0]);
  if(aim!==null) player.turret=aim;
  if(firing&&player.cool<=0&&bullets.length<60) fire();
}

/* ---------------- Update ---------------- */
function updatePlayer(dt){
  player.inv=Math.max(0,player.inv-dt);
  player.cool=Math.max(0,player.cool-dt);
  player.muzzle=Math.max(0,player.muzzle-dt);
  player.recoil=Math.max(0,player.recoil-dt*6);
  const mv=getMoveVec(); lastMove=mv;
  const spd=P_SPEED*(1+profile.speedLv*0.08);
  if(mv[0]||mv[1]){
    player.hull=turnToward(player.hull,Math.atan2(mv[1],mv[0]),9*dt);
    const f=mv[0]*Math.cos(player.hull)+mv[1]*Math.sin(player.hull);
    player.track+=f*150*dt;
    player.exT-=dt;
    if(player.exT<=0&&EQ()>0.6){
      player.exT=0.1;
      newParticle(player.x-Math.cos(player.hull)*24,player.y-Math.sin(player.hull)*24,
        -Math.cos(player.hull)*40+rand(-14,14),-Math.sin(player.hull)*40+rand(-14,14),
        0.45,2,'rgba(120,200,255,0.5)');
    }
  }
  moveWithCollision(player,mv[0]*spd*dt,mv[1]*spd*dt);
  const want=(mv[0]!==0||mv[1]!==0);
  const expect=spd*dt;
  const moved=Math.hypot(player.x-lastPX,player.y-lastPY);
  if(want&&expect>0.01&&moved<expect*0.12){
    stuckT+=dt;
    const hit=circleWallHit(player.x,player.y,player.r);
    const embed=hit?(player.r-Math.sqrt(hit.d2)):0;
    if(embed>player.r*0.3&&stuckT>0.45){ unstuckPlayer(); stuckT=0; }
    else if(stuckT>1.6){
      let near=0;
      for(let i=0;i<enemies.length;i++){
        const en=enemies[i];
        if(!en.dead&&Math.hypot(en.x-player.x,en.y-player.y)<player.r*2.5) near++;
      }
      if(near>=2){ unstuckPlayer(); stuckT=0; }
      else stuckT=0.8;
    }
  }else stuckT=0;
  lastPX=player.x; lastPY=player.y;
  updateAimFire();
}
function updateEnemy(e,dt){
  e.spawnT=Math.max(0,e.spawnT-dt);
  e.alert=Math.max(0,e.alert-dt);
  e.flash=Math.max(0,e.flash-dt);
  e.muzzle=Math.max(0,e.muzzle-dt);
  e.recoil=Math.max(0,e.recoil-dt*4);
  e.kx*=Math.exp(-5*dt); e.ky*=Math.exp(-5*dt);
  const dxp=player.x-e.x, dyp=player.y-e.y, distP=Math.hypot(dxp,dyp);
  e.seeT-=dt;
  if(e.seeT<=0){
    e.seeT=0.18;
    e.see=(distP<820)&&losClear(e.x,e.y,player.x,player.y);
  }
  const see=e.see;
  if(see) e.alert=1.2;
  if(e.type!=='chaser'){
    const target=Math.atan2(dyp,dxp);
    if(e.windup>0){ if(e.windup>0.2) e.aimAng=turnToward(e.aimAng,target,6*dt); }
    else e.aimAng=turnToward(e.aimAng,target,(e.type==='heavy'?2.2:4.0)*dt);
    if(e.windup>0){
      e.windup-=dt;
      if(e.windup<=0){ enemyFire(e); e.muzzle=0.08; e.recoil=1; e.shootT=e.period*rand(0.85,1.25); }
    }else{
      e.shootT-=dt;
      if(see&&e.shootT<=0&&distP<(e.type==='heavy'?560:680))
        e.windup=e.type==='heavy'?HW:GW;
    }
  }
  let desired=null, spd=0;
  if(e.type==='chaser'){
    spd=e.speed;
    desired=see?Math.atan2(dyp,dxp):flowDirAt(e.x,e.y);
    if(desired===null){ e.wanderT-=dt; if(e.wanderT<=0){ e.wanderA=rand(0,TAU); e.wanderT=rand(1,2.2);} desired=e.wanderA; }
    desired+=Math.sin(animTime*3+e.phase)*0.25;
  }else if(e.type==='gunner'){
    if(e.windup>0||(e.windup<=0&&see&&distP<520)) spd=0;
    else{
      spd=e.speed;
      desired=flowDirAt(e.x,e.y);
      if(desired===null){ e.wanderT-=dt; if(e.wanderT<=0){ e.wanderA=rand(0,TAU); e.wanderT=rand(1.4,2.8);} desired=e.wanderA; }
    }
  }else{
    if(e.windup>0) spd=0;
    else{
      spd=e.speed;
      desired=see?Math.atan2(dyp,dxp):flowDirAt(e.x,e.y);
      if(desired===null){ e.wanderT-=dt; if(e.wanderT<=0){ e.wanderA=rand(0,TAU); e.wanderT=rand(1.5,3);} desired=e.wanderA; }
    }
  }
  if(spd>0&&desired!==null){
    desired=steerClear(e,desired);
    const turn=e.type==='heavy'?2.2:(e.type==='gunner'?3.2:5.0);
    e.hull=turnToward(e.hull,desired,turn*dt);
  }
  const mvx=Math.cos(e.hull)*spd+e.kx, mvy=Math.sin(e.hull)*spd+e.ky;
  e.track+=Math.hypot(mvx,mvy)*dt;
  const blocked=moveWithCollision(e,mvx*dt,mvy*dt);
  if(blocked&&spd>0&&!see){ e.wanderA=rand(0,TAU); e.wanderT=rand(0.8,1.6); }
}
function updateEnemies(dt){
  for(let i=0;i<enemies.length;i++) if(!enemies[i].dead) updateEnemy(enemies[i],dt);
  for(let i=0;i<enemies.length;i++) for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i], b=enemies[j];
    if(a.dead||b.dead) continue;
    const dx=b.x-a.x, dy=b.y-a.y, rs=a.r+b.r, d2=dx*dx+dy*dy;
    if(d2<rs*rs&&d2>0.01){
      const d=Math.sqrt(d2), push=(rs-d)/2, nx=dx/d, ny=dy/d;
      a.x-=nx*push; a.y-=ny*push; b.x+=nx*push; b.y+=ny*push;
      resolveCircle(a); resolveCircle(b);
    }
  }
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e.dead) continue;
    const dx=player.x-e.x, dy=player.y-e.y, rs=e.r+player.r, d2=dx*dx+dy*dy;
    if(d2<rs*rs&&d2>0.01){
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, push=rs-d;
      player.x+=nx*push*0.6; player.y+=ny*push*0.6;
      e.x-=nx*push*0.6; e.y-=ny*push*0.6;
      resolveCircle(player); resolveCircle(e);
      hurtPlayer();
    }
  }
  let w=0, despawnN=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e.dead) continue;
    if(Math.hypot(e.x-player.x,e.y-player.y)>=DESPAWN){ despawnN++; continue; }
    enemies[w++]=e;
  }
  enemies.length=w;
  if(despawnN>0) spawnLock=Math.max(spawnLock,3.5);
}
function updateBullets(dt){
  const sub=SUB, sdt=dt/sub;
  for(let bi=0;bi<bullets.length;bi++){
    const b=bullets[bi];
    if(b.dead) continue;
    b.life-=dt;
    if(b.life<=0){ shatter(b,true); continue; }
    if(!b.armed){
      const o=b.owner;
      if(Math.hypot(b.x-o.x,b.y-o.y)>o.r+b.r+8) b.armed=true;
    }
    // homing: steer toward nearest living enemy
    if(b.homing&&b.armed){
      let best=null, bd=Infinity;
      for(let k=0;k<enemies.length;k++){
        const e=enemies[k];
        if(e.dead||e===b.owner) continue;
        const dd=Math.hypot(e.x-b.x,e.y-b.y);
        if(dd<bd){ bd=dd; best=e; }
      }
      if(best){
        const curA=Math.atan2(b.vy,b.vx);
        const tgtA=Math.atan2(best.y-b.y,best.x-b.x);
        const na=turnToward(curA,tgtA,5.5*dt);
        const sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
      }
    }
    for(let i=0;i<sub&&!b.dead;i++){
      b.x+=b.vx*sdt; b.y+=b.vy*sdt;
      if(reflectBullet(b)){
        b.bounces++;
        if(EQ()>0.55){
          rings.push(mkRing(b.x,b.y,2,14+b.r,0.25,b.fromPlayer?'rgba(120,225,255,':(b.big?'rgba(220,140,255,':'rgba(255,170,110,')));
          spawnSparks(b.x,b.y,3,b.fromPlayer?'#9fe8ff':(b.big?'#e2a6ff':'#ffc9a0'),80);
        }
        bounceSnd();
        if(b.bounces>=b.maxB){ shatter(b,true); break; }
      }
      hitUnits(b);
    }
    if(!b.dead){
      if(EQ()>0.55){ b.trail.push(b.x,b.y); if(b.trail.length>26) b.trail.splice(0,2); }
      else b.trail.length=0;
    }
  }
  let w=0;
  for(let i=0;i<bullets.length;i++) if(!bullets[i].dead) bullets[w++]=bullets[i];
  bullets.length=w;
}

/* ---------------- Quiz cooldown (shared) ---------------- */
function tickQuizCooldown(dt){
  if(quizCooldown>0) quizCooldown-=dt;
}

/* ---------------- Update main ---------------- */
let startBanner=0, overT=0, overShown=false, overReason='';
function update(dt){
  animTime+=dt;
  if(startBanner>0) startBanner-=dt;
  if(threatBanner>0) threatBanner-=dt;
  greenFlash=Math.max(0,greenFlash-dt*1.4);
  { // particles
    let w=0;
    for(let i=0;i<particles.length;i++){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const dr=Math.exp(-2.4*dt); p.vx*=dr; p.vy*=dr; p.life-=dt;
      if(p.life>0) particles[w++]=p;
      else if(pPool.length<500) pPool.push(p);
    }
    particles.length=w;
  }
  const pCap=Math.floor(300*EQ());
  if(particles.length>pCap) particles.splice(0,particles.length-pCap);
  {
    let w=0;
    for(let i=0;i<rings.length;i++){ const r=rings[i]; r.t+=dt; if(r.t<r.dur) rings[w++]=r; }
    rings.length=w;
  }
  {
    let w=0;
    for(let i=0;i<floats.length;i++){ const f=floats[i]; f.y-=42*dt; f.life-=dt; if(f.life>0) floats[w++]=f; }
    floats.length=w;
  }
  shake*=Math.exp(-7*dt);
  redFlash=Math.max(0,redFlash-dt*1.4);
  scoreDisp+=(score-scoreDisp)*Math.min(1,dt*10);
  if(Math.abs(score-scoreDisp)<0.5) scoreDisp=score;

  if(state==='playing'&&!paused){
    elapsed+=dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateSpawner(dt);
    tickQuizCooldown(dt);
    updateHealPacks(dt);
    checkHealPackPickup();
    updatePortals(dt);
    checkPortalPickup();
    updateNuke(dt);
    // nuke charge: hold F for 2 seconds
    if(nukeCharging && profile.nukeStock>0){
      nukeCharge=Math.min(2, nukeCharge+dt);
      if(nukeCharge>=2){
        nukeCharging=false; nukeCharge=0;
        detonateNuke();
      }
    }else if(!nukeCharging){
      nukeCharge=Math.max(0, nukeCharge-dt*3);
    }
    flowT-=dt;
    if(flowT<=0){ computeFlow(); flowT=0.35; }
    const th=threat();
    if(th>lastThreat){ lastThreat=th; threatBanner=2.2; Sound.threat(); }
    const tx=player.x+Math.cos(player.turret)*46, ty=player.y+Math.sin(player.turret)*46;
    cam.x+=(tx-cam.x)*Math.min(1,dt*4.5);
    cam.y+=(ty-cam.y)*Math.min(1,dt*4.5);
  }else if(state==='lobby'){
    player.turret=animTime*0.5;
    cam.x+=(player.x+Math.cos(animTime*0.25)*70-cam.x)*Math.min(1,dt*2);
    cam.y+=(player.y+Math.sin(animTime*0.2)*50-cam.y)*Math.min(1,dt*2);
  }else if(state==='gameover'){
    updateBullets(dt);
    if(overT>0){ overT-=dt; if(overT<=0&&!overShown){ overShown=true; showGameOver(); } }
  }
}

/* ---------------- Effects ---------------- */
const pPool=[];
function newParticle(x,y,vx,vy,life,size,color){
  const p=pPool.pop()||{};
  p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.maxLife=life; p.size=size; p.color=color;
  particles.push(p);
}
function mkRing(x,y,r0,r1,dur,col){ return {x:x,y:y,r0:r0,r1:r1,dur:dur,t:0,color:col}; }
function spawnExplosion(x,y){
  const cols=['#ff6b4a','#ffd166','#ff5252','#ffffff','#ff9f43'];
  const cnt=Math.max(6,Math.floor(18*EQ()));
  for(let i=0;i<cnt;i++){
    const a=rand(0,TAU), sp=rand(50,320), life=rand(0.3,0.8);
    newParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,life,rand(1.5,4),cols[(Math.random()*cols.length)|0]);
  }
}
function spawnSparks(x,y,n,color,speed){
  const cnt=Math.max(2,Math.floor(n*EQ()));
  for(let i=0;i<cnt;i++){
    const a=rand(0,TAU), sp=rand(speed*0.4,speed), life=rand(0.15,0.4);
    newParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,life,rand(1,2.5),color);
  }
}

// Safe dashed-line helper: older engines may lack setLineDash; degrade to solid.
function _setDash(c,pattern,offset){
  if(c.setLineDash){
    try{ c.setLineDash(pattern); }catch(e){}
    try{ c.lineDashOffset=offset; }catch(e){}
  }
}
function _clearDash(c){
  if(c.setLineDash){ try{ c.setLineDash([]); }catch(e){} }
}

/* ---------------- Draw ---------------- */
// Polyfill-free ellipse: older WebKit engines lack ctx.ellipse, so draw the
// shadow as a scaled arc path instead (identical visual, universally supported).
function _ellipsePath(c,x,y,rx,ry){
  c.save(); c.translate(x,y); c.scale(rx,ry); c.beginPath(); c.arc(0,0,1,0,TAU); c.restore();
}
function shadowAt(x,y,rx,ry,ang){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,0.32)';
  if(ctx.ellipse){
    ctx.beginPath(); ctx.ellipse(1.5,3.5,rx,ry,0,0,TAU); ctx.fill();
  }else{
    ctx.save(); ctx.translate(1.5,3.5); ctx.scale(rx,ry);
    ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
function drawUnit(x,y,hull,turret,hs,ts,trk,phase,recoil,treadCol){
  ctx.save(); ctx.translate(x,y);
  ctx.save(); ctx.rotate(hull);
  ctx.drawImage(hs.c,-hs.w/2,-hs.h/2,hs.w,hs.h);
  ctx.fillStyle=treadCol;
  const sp=6.5, off=((phase%sp)+sp)%sp;
  for(let ti=0;ti<trk.ys.length;ti++){
    const ty=trk.ys[ti];
    for(let lx=trk.x0-sp+off; lx<trk.x0+trk.len; lx+=sp)
      ctx.fillRect(lx,ty-trk.h/2+1.2,2.2,trk.h-2.4);
  }
  ctx.restore();
  const rx=-Math.cos(turret)*recoil*3, ry=-Math.sin(turret)*recoil*3;
  ctx.save(); ctx.translate(rx,ry); ctx.rotate(turret);
  ctx.drawImage(ts.c,-ts.w/2,-ts.h/2,ts.w,ts.h);
  ctx.restore();
  ctx.restore();
}
function flashHit(x,y,r,f){
  if(f<=0) return;
  ctx.globalAlpha=f/0.12*0.7;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
}
function muzzleFlash(x,y,ang,tip,k,c1,c2){
  ctx.save();
  ctx.translate(x+Math.cos(ang)*tip,y+Math.sin(ang)*tip); ctx.rotate(ang);
  ctx.globalAlpha=Math.min(1,k*1.3);
  ctx.fillStyle=c1;
  if(FX_SHADOW()){ ctx.shadowColor=c2; ctx.shadowBlur=16; }
  ctx.beginPath(); ctx.moveTo(16*k+4,0); ctx.lineTo(2,5.5); ctx.lineTo(5,0); ctx.lineTo(2,-5.5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,4*k+2,0,TAU); ctx.fill();
  ctx.restore();
}
function chargeDot(x,y,ang,tip,k,rgb){
  ctx.save();
  ctx.fillStyle='rgba('+rgb+','+(0.45+0.55*k)+')';
  if(FX_SHADOW()){ ctx.shadowColor='rgba('+rgb+',1)'; ctx.shadowBlur=10+16*k; }
  ctx.beginPath(); ctx.arc(x+Math.cos(ang)*tip,y+Math.sin(ang)*tip,2.5+4.5*k,0,TAU); ctx.fill();
  ctx.restore();
}
function drawPlayerTank(){
  if(state==='gameover') return;
  const p=player;
  const S=SPR.player;
  ctx.save();
  if(EQ()>0.55) shadowAt(p.x,p.y,30,20,p.hull);
  if(p.inv>0) ctx.globalAlpha=0.5+0.35*Math.sin(animTime*24);
  drawUnit(p.x,p.y,p.hull,p.turret,S.hull,S.tur,TRK.player,p.track,p.recoil,S.pal.tread);
  ctx.globalAlpha=1;
  if(p.cool>0){
    const pr=1-p.cool/Math.max(0.01,p.coolMax||CD);
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,21,-Math.PI/2,-Math.PI/2+pr*TAU); ctx.stroke();
  }
  if(p.muzzle>0) muzzleFlash(p.x,p.y,p.turret,29+2.5,p.muzzle/0.09,'#fff8cc','#ffd166');
  ctx.restore();
}
function drawChaser(e){
  if(EQ()>0.55) shadowAt(e.x,e.y,24,16,e.hull);
  drawUnit(e.x,e.y,e.hull,e.hull,SPR.cHull,SPR.cTur,TRK.chaser,e.track,e.recoil,PAL.chaser.tread);

    const pl=0.5+0.5*Math.sin(animTime*8+e.phase);
    ctx.strokeStyle='rgba(255,80,80,'+(0.25+0.4*pl)+')'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(e.x,e.y,15+2*pl,0,TAU); ctx.stroke();
  }
  flashHit(e.x,e.y,13,e.flash);
