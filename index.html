function drawGunner(e){
  if(EQ()>0.55) shadowAt(e.x,e.y,25,16,e.hull);
  drawUnit(e.x,e.y,e.hull,e.aimAng,SPR.gHull,SPR.gTur,TRK.gunner,e.track,e.recoil,PAL.gunner.tread);
  if(e.windup>0) chargeDot(e.x,e.y,e.aimAng,34,1-e.windup/GW,'255,110,60');
  flashHit(e.x,e.y,14,e.flash);
  if(e.muzzle>0) muzzleFlash(e.x,e.y,e.aimAng,34,e.muzzle/0.08,'#fff1d0','#ffab40');
}
function drawHeavy(e){
  if(EQ()>0.55) shadowAt(e.x,e.y,34,22,e.hull);
  drawUnit(e.x,e.y,e.hull,e.aimAng,SPR.hHull,SPR.hTur,TRK.heavy,e.track,e.recoil,PAL.heavy.tread);
  if(EQ()>0.55){
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(animTime*0.9);
    ctx.strokeStyle='rgba(230,120,255,0.35)'; ctx.lineWidth=2;
    for(let i=0;i<6;i++){ ctx.rotate(TAU/6); ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(20,0); ctx.stroke(); }
    ctx.restore();
  }
  if(e.windup>0) chargeDot(e.x,e.y,e.aimAng,40,1-e.windup/HW,'220,120,255');
  const bw=e.r*2;
  ctx.fillStyle='rgba(0,0,0,0.55)'; rr(ctx,e.x-bw/2,e.y-e.r-14,bw,5,2); ctx.fill();
  const seg=(bw-2)/e.maxHp;
  for(let i=0;i<e.maxHp;i++){
    ctx.fillStyle=i<e.hp?'#ff6bd6':'rgba(255,255,255,0.15)';
    ctx.fillRect(e.x-bw/2+1+i*seg,e.y-e.r-13,seg-1.5,3);
  }
  flashHit(e.x,e.y,20,e.flash);
  if(e.muzzle>0) muzzleFlash(e.x,e.y,e.aimAng,40,e.muzzle/0.08,'#f6e2ff','#d96bff');
}
function drawEnemy(e){
  if(e.dead) return;
  ctx.save();
  if(e.spawnT>0){
    const k=e.spawnT/0.4, sc=1-0.45*k;
    ctx.translate(e.x,e.y); ctx.scale(sc,sc); ctx.translate(-e.x,-e.y);
  }
  if(e.type==='chaser') drawChaser(e);
  else if(e.type==='gunner') drawGunner(e);
  else drawHeavy(e);
  ctx.restore();
}
function bulletColors(b){
  if(b.fromPlayer){
    // use per-weapon color if present
    if(b.color){
      const c=b.color;
      return ['#ffffff', c, c];
    }
    if(b.pierce) return ['#fff4e0','#ffb14a','#e27a20'];
    if(b.homing) return ['#fbe6ff','#d96bff','#8a2fb8'];
    return ['#dff6ff','#7fdcff','#1e9ed6'];
  }
  if(b.big) return ['#fbe6ff','#d96bff','#8a2fb8'];
  return ['#fff1e0','#ffb27a','#ff7043'];
}
function drawBullets(){
  const drawTrail=EQ()>0.55;
  for(let bi=0;bi<bullets.length;bi++){
    const b=bullets[bi];
    const warn=b.maxB-b.bounces<=1;
    const cs=bulletColors(b);
    if(drawTrail&&b.trail.length>=4){
      const n=b.trail.length/2;
      for(let i=0;i<n;i++){
        const k=(i+1)/n;
        ctx.globalAlpha=k*k*0.28;
        ctx.fillStyle=warn?'#ffb14a':cs[1];
        ctx.beginPath(); ctx.arc(b.trail[i*2],b.trail[i*2+1],b.r*k*0.8,0,TAU); ctx.fill();
      }
    }
    ctx.globalAlpha=warn?(0.6+0.4*Math.sin(animTime*18)):1;
    ctx.save();
    if(FX_SHADOW()){ ctx.shadowColor=cs[1]; ctx.shadowBlur=12+b.r; }
    const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r);
    g.addColorStop(0,warn?'#fff':cs[0]);
    g.addColorStop(0.5,warn?'#ffb14a':cs[1]);
    g.addColorStop(1,warn?'#e25822':cs[2]);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }
}
function drawFX(){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const k=Math.max(0,p.life/p.maxLife);
    ctx.globalAlpha=k; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+0.6*k),0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=0;i<rings.length;i++){
    const r=rings[i];
    const p=r.t/r.dur, rad=r.r0+(r.r1-r.r0)*(1-Math.pow(1-p,3));
    ctx.strokeStyle=r.color+(1-p)+')';
    ctx.lineWidth=Math.max(0.5,3*(1-p));
    ctx.beginPath(); ctx.arc(r.x,r.y,rad,0,TAU); ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<floats.length;i++){
    const f=floats[i];
    ctx.globalAlpha=Math.min(1,f.life/0.35);
    ctx.font=(f.big?'bold 18px':'bold 13px')+' Consolas, monospace';
    ctx.fillStyle=f.color;
    if(FX_SHADOW()){ ctx.shadowColor=f.color; ctx.shadowBlur=8; }
    ctx.fillText(f.text,f.x,f.y); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
function drawWarnings(){
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if((e.type!=='gunner'&&e.type!=='heavy')||e.windup<=0) continue;
    const heavy=e.type==='heavy';
    const maxD=heavy?580:690;
    if(animTime-e.warnT>0.15){
      e.warnT=animTime;
      e.warnD=Math.min(rayWallDist(e.x,e.y,e.aimAng),maxD);
    }
    const d=Math.min(e.warnD,maxD);
    const k=1-e.windup/(heavy?HW:GW);
    ctx.save();
    _setDash(ctx,[6,6],-animTime*60);
    ctx.strokeStyle='rgba('+(heavy?'255,120,255':'255,80,80')+','+(0.2+0.5*k)+')';
    ctx.lineWidth=heavy?2:1.5;
    ctx.beginPath();
    ctx.moveTo(e.x+Math.cos(e.aimAng)*(e.r+6),e.y+Math.sin(e.aimAng)*(e.r+6));
    ctx.lineTo(e.x+Math.cos(e.aimAng)*d,e.y+Math.sin(e.aimAng)*d);
    ctx.stroke();
    _clearDash(ctx);
    ctx.restore();
  }
}
function drawAimLine(){
  if(state!=='playing') return;
  const a=player.turret;
  const d=Math.min(150,rayWallDist(player.x,player.y,a)-10);
  if(d<20) return;
  const off=29;
  const sx=player.x+Math.cos(a)*off, sy=player.y+Math.sin(a)*off;
  ctx.save();
  _setDash(ctx,[5,7],-(animTime*50)%12);
  ctx.strokeStyle='rgba(0,229,255,0.3)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(a)*d,sy+Math.sin(a)*d); ctx.stroke();
  _clearDash(ctx);
  ctx.restore();
}
function renderWorld(){
  const camL=cam.x-W/2, camT=cam.y-H/2;
  ctx.save();
  if(shake>0.05) ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.translate(-camL,-camT);
  ctx.fillStyle=floorPattern||'#0a1220';
  ctx.fillRect(camL-4,camT-4,W+8,H+8);
  const q=EQ();
  if(q>0.6){
    const lg=ctx.createRadialGradient(player.x,player.y,40,player.x,player.y,380);
    lg.addColorStop(0,'rgba(70,150,210,0.12)'); lg.addColorStop(1,'rgba(70,150,210,0)');
    ctx.fillStyle=lg; ctx.fillRect(player.x-380,player.y-380,760,760);
  }
  const vl=camL-40, vt=camT-40, vr2=camL+W+40, vb=camT+H+40;
  ctx.fillStyle='#04060a';
  for(let i=0;i<decals.length;i++){
    const d=decals[i];
    if(d.x+d.r<vl||d.x-d.r>vr2||d.y+d.r<vt||d.y-d.r>vb) continue;
    ctx.globalAlpha=d.a;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  const c0=Math.floor(camL/CELL)-1, c1=Math.floor((camL+W)/CELL)+1;
  const r0=Math.floor(camT/CELL)-1, r1=Math.floor((camT+H)/CELL)+1;
  const shadowBars=q>0.7;
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!gameWall(c,r)) continue;
    ctx.drawImage(wallTiles[wallVariant(c,r)],c*CELL,r*CELL,CELL,CELL);
    if(shadowBars){
      ctx.fillStyle='rgba(0,0,0,0.2)';
      if(!gameWall(c,r+1)) ctx.fillRect(c*CELL,(r+1)*CELL,CELL,5);
      if(!gameWall(c,r-1)) ctx.fillRect(c*CELL,r*CELL-5,CELL,5);
      if(!gameWall(c-1,r)) ctx.fillRect(c*CELL-5,r*CELL,5,CELL);
      if(!gameWall(c+1,r)) ctx.fillRect((c+1)*CELL,r*CELL,5,CELL);
    }
  }
  drawWarnings();
  drawAimLine();
  for(let i=0;i<enemies.length;i++) drawEnemy(enemies[i]);
  drawHealPacks();
  drawPortals();
  drawPlayerTank();
  drawBullets();
  drawFX();
  ctx.restore();
}

let vg=null, vgRed=null, vgGreen=null;
function drawVignette(){

function drawLowHP(){

function drawGreenFlash(){

    vgGreen.addColorStop(0,'rgba(0,0,0,0)'); vgGreen.addColorStop(1,'rgba(80,255,160,1)');
  }
  ctx.globalAlpha=greenFlash*0.25;
  ctx.fillStyle=vgGreen; ctx.fillRect(0,0,W,H);

function heartPath(c,x,y,s){
  c.beginPath(); c.moveTo(x,y+s*0.3);
  c.bezierCurveTo(x+s*0.55,y-s*0.1,x+s*0.38,y-s*0.5,x,y-s*0.16);
  c.bezierCurveTo(x-s*0.38,y-s*0.5,x-s*0.55,y-s*0.1,x,y+s*0.3);
  c.closePath();
}
function drawHeartSlot(hx,hy,fill){
  if(fill>=1){
    ctx.fillStyle='#ff4d6d';
    if(FX_SHADOW()){ ctx.shadowColor='rgba(255,77,109,0.8)'; ctx.shadowBlur=8; }
    heartPath(ctx,hx,hy,18); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.35)'; heartPath(ctx,hx,hy-2,7); ctx.fill();
  }else if(fill>=0.5){
    ctx.strokeStyle='rgba(150,70,90,0.5)'; ctx.lineWidth=1.5;
    heartPath(ctx,hx,hy,18); ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.rect(hx-10,hy-10,10,20); ctx.clip();
    ctx.fillStyle='#ff4d6d'; heartPath(ctx,hx,hy,18); ctx.fill();
    ctx.restore();
  }else{
    ctx.strokeStyle='rgba(150,70,90,0.5)'; ctx.lineWidth=1.5;
    heartPath(ctx,hx,hy,18); ctx.stroke();
  }
}
function fmtTime(s){ const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function drawHUD(){
  ctx.fillStyle='rgba(4,9,18,0.78)'; ctx.fillRect(0,0,W,40);
  ctx.strokeStyle='rgba(0,229,255,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,40.5); ctx.lineTo(W,40.5); ctx.stroke();
  ctx.textBaseline='middle';
  const nHearts=Math.max(3,hpMax);
  for(let i=0;i<nHearts;i++){

  }
  ctx.textAlign='center';

  ctx.fillText('威胁等级 · LV.'+th,W/2,14); ctx.shadowBlur=0;
  ctx.fillStyle='#54749c'; ctx.font='11px sans-serif';

  ctx.fillStyle='#ffe08a'; ctx.font='bold 15px Consolas,monospace';
  ctx.fillText('🪙 '+String(Math.round(scoreDisp)).padStart(3,'0'),W-18,13);
  ctx.fillStyle='#8fb6d8'; ctx.font='12px sans-serif';
  ctx.fillText('击杀 '+kills+' · '+fmtTime(elapsed),W-18,31);
}
function drawAmmoHUD(){
  if(state==='lobby') return;
  const x=16, y=compact?52:56;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.save();
  ctx.fillStyle=ammo>0?'#ffd166':'#ff5c6e';
  for(let i=0;i<3;i++){

    ctx.moveTo(bx+2.5,y-6);

    ctx.lineTo(bx,y);
    ctx.quadraticCurveTo(bx,y-2,bx+2.5,y-6);
    ctx.closePath(); ctx.fill();
  }

function drawBanners(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(state==='playing'&&startBanner>0){
    ctx.globalAlpha=Math.min(1,startBanner/0.5)*0.95;
    ctx.fillStyle='#7fe7ff';
    if(FX_SHADOW()){ ctx.shadowColor='rgba(0,229,255,0.8)'; ctx.shadowBlur=18; }
    ctx.font="bold "+(compact?20:28)+"px 'Segoe UI',sans-serif";
    ctx.fillText('边玩边学 · SURVIVE & LEARN!',W/2,H*0.3);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(threatBanner>0){
    ctx.globalAlpha=Math.min(1,threatBanner/0.5)*0.95;

    if(FX_SHADOW()){ ctx.shadowColor=threatColor(lastThreat); ctx.shadowBlur=16; }
    ctx.font="bold "+(compact?18:24)+"px 'Segoe UI',sans-serif";
    ctx.fillText('⚠ 威胁升级 · THREAT LV.'+lastThreat,W/2,H*0.3);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(paused&&state==='playing'&&!quizEl.classList.contains('show')){
    ctx.fillStyle='rgba(3,7,16,0.55)'; ctx.fillRect(0,0,W,H);
  }
}
function drawSticks(){
  const R=JOY_R;
  for(let pi=0;pi<2;pi++){
    const st=pi===0?sticks.move:sticks.aim;
    const rgb=pi===0?'0,229,255':'255,150,90';
    if(!st) continue;
    ctx.fillStyle='rgba('+rgb+',0.07)';
    ctx.strokeStyle='rgba('+rgb+',0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(st.bx,st.by,R,0,TAU); ctx.fill(); ctx.stroke();
    let dx=st.x-st.bx, dy=st.y-st.by;
    const l=Math.hypot(dx,dy);
    if(l>R){ dx=dx/l*R; dy=dy/l*R; }
    ctx.fillStyle='rgba('+rgb+',0.45)';
    ctx.beginPath(); ctx.arc(st.bx+dx,st.by+dy,20,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba('+rgb+',0.8)';
    ctx.beginPath(); ctx.arc(st.bx+dx,st.by+dy,20,0,TAU); ctx.stroke();
  }
}
function drawCrosshair(){
  if(touchMode||!mouse.inside||state!=='playing'||paused) return;
  ctx.save(); ctx.translate(mouse.x,mouse.y);
  ctx.strokeStyle='rgba(0,229,255,0.85)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-16,0); ctx.lineTo(-6,0); ctx.moveTo(6,0); ctx.lineTo(16,0);
  ctx.moveTo(0,-16); ctx.lineTo(0,-6); ctx.moveTo(0,6); ctx.lineTo(0,16);
  ctx.stroke();
  ctx.fillStyle='#7fe7ff';
  ctx.beginPath(); ctx.arc(0,0,1.5,0,TAU); ctx.fill();
  ctx.restore();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  renderWorld();
  drawVignette();
  drawLowHP();
  drawGreenFlash();
  drawNukeCharge();
  drawNukeFlash();
  if(redFlash>0){ ctx.fillStyle='rgba(255,45,45,'+(redFlash*0.32)+')'; ctx.fillRect(0,0,W,H); }
  if(state!=='lobby') drawHUD();
  drawAmmoHUD();
  drawBanners();
  drawSticks();
  drawCrosshair();
}

// Draw nuke charge ring while F is held
function drawNukeCharge(){

  ctx.globalAlpha=0.3;

  ctx.beginPath(); ctx.arc(x,y,48,0,TAU); ctx.stroke();
  ctx.restore();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffe08a'; ctx.font='bold 13px Consolas,monospace';

}
// Full-screen white-orange flash on detonation
function drawNukeFlash(){

const lobbyEl=document.getElementById('lobby'), lbHome=document.getElementById('lbHome');
const rangeGrid=document.getElementById('rangeGrid');
function buildLobbyStats(){
  document.getElementById('lbStats').innerHTML=
    '<div class="lb-card">🏆 金币纪录 Gold<b>'+best+'</b></div>'
    +'<div class="lb-card">🪙 金币 Coins<b>'+profile.coins+'</b></div>'

    +'<div class="lb-card">🎓 高考高频 Gaokao<b>'+GAOKAO.length+'</b></div>';
}
function buildRangeGrid(){
  // Grade counts must match gradeBand() boundaries (GRADE7_END / GRADE8_END),
  // NOT an even third-split — otherwise the displayed counts are wrong.
  const g7 = GRADE7_END;
  const g8 = GRADE8_END - GRADE7_END;
  const g9 = CORE_COUNT - GRADE8_END;
  const ranges=[
    {id:'all', label:'全部 · All', cnt:WORDS.length},
    {id:'grade7', label:'初一 · Grade 7', cnt:g7},
    {id:'grade8', label:'初二 · Grade 8', cnt:g8},
    {id:'grade9', label:'初三 · Grade 9', cnt:g9},
    {id:'custom', label:'自定义词库 · Custom', cnt:customWords.length},
    {id:'wrongbook', label:'错题本 · Review', cnt:wrongBook.length},
    {id:'gaokao', label:'高考高频 · Gaokao', cnt:GAOKAO_WORDS.length},
  ];
  rangeGrid.innerHTML='';
  for(const r of ranges){
    const b=document.createElement('button');
    b.className='range-btn'+(scope===r.id?' on':'');
    b.innerHTML=r.label+'<span class="cnt">'+r.cnt+' words</span>';
    b.addEventListener('click',()=>{
      Sound.init();
      // Guard: warn (but still allow select) when the scope has no content yet,
      // so the user isn't left stuck with zero questions mid-game.
      if(r.id==='custom' && !customWords.length){
        toast('📥 自定义词库为空，请先在「设置 → 自定义词库」粘贴词条 · Custom bank is empty', true);
      } else if(r.id==='wrongbook' && !wrongBook.length){
        toast('📕 错题本为空，答错单词后会自动收录 · Wrong book is empty', true);
      }
      scope=r.id;
      saveLS('wt_scope',scope);
      if(scope==='custom'){ customDone=new Set(); customWrong=[]; }
      buildRangeGrid();
    });
    rangeGrid.appendChild(b);
  }
}
function goLobby(){
  state='lobby'; paused=false; hideUI();
  quizEl.classList.remove('show');
  lobbyEl.classList.remove('hidden');
  lbHome.style.display='';
  buildLobbyStats();
  Sound.stopMusic();
}
function startGame(){
  // Guard: refuse to start when the selected scope has no questions,
  // otherwise the player is stuck at 0 shells with nothing to answer.
  if(scope==='custom' && !customWords.length){
    toast('📥 自定义词库为空，无法开始。请先在「设置 → 自定义词库」添加词条 · Custom bank is empty', true);
    scope='all'; saveLS('wt_scope',scope); buildRangeGrid();
    return;
  }
  if(scope==='wrongbook' && !wrongBook.length){
    toast('📕 错题本为空，无法复习。答题答错后会自动收录到这里 · Wrong book is empty', true);
    scope='all'; saveLS('wt_scope',scope); buildRangeGrid();
    return;
  }
  Sound.init();
  Sound.startMusic();
  // reset state
  playSeed=(Math.random()*2147483647)|0;
  bullets=[]; enemies=[]; particles=[]; rings=[]; floats=[]; decals=[];
  elapsed=0; score=0; scoreDisp=0; kills=0;
  hpMax=computeHpMax();
  hp=hpMax; ammo=0;
  runCoins=0;
  // medkit: consume 1 if owned => +1 extra HP this run
  if(profile.medkitStock>0){ profile.medkitStock--; hpMax+=1; hp=hpMax; }
  // shield: consume 1 from stock if available (auto-equip at start)
  shieldActive = profile.shieldStock>0;
  if(shieldActive) profile.shieldStock--;
  saveProfile();
  correctStreak=0; comboCount=0; healPacks=[]; healPackT=6; healPending=false; healEnemyRef=null;
  reviveCount=0; reviveActive=false; reviveProgress=0;
  portals=[]; portalT=25; nukeCharge=0; nukeCharging=false; nukeFlash=0;
  // reset custom-scope progress each run
  customDone=new Set(); customWrong=[];
  wrongQueue=[];
  gaokaoWrong=[];
  player.x=CELL/2; player.y=CELL/2; player.r=P_R;
  player.hull=-Math.PI/2; player.turret=-Math.PI/2;
  player.inv=1.2; player.cool=0; player.coolMax=CD; player.muzzle=0; player.recoil=0;
  player.track=0; player.exT=0;
  stuckT=0; lastPX=player.x; lastPY=player.y;
  cam.x=player.x; cam.y=player.y;
  spawnT=1.4; spawnLock=0; flowT=0; flow=null; regionCount=0; computeFlow();
  startBanner=2.6; threatBanner=0; greenFlash=0; lastThreat=1;
  shake=0; redFlash=0; overShown=false; paused=false;
  quizCooldown=0;
  quizTrigger='voluntary';
  overReason='';
  wrongQueue=[];
  mouse.down=false;
  for(const k in keys) delete keys[k];

/* Parse raw txt into {words:[{en,cn}], skipped:n}
   Handles: "apple 苹果", "apple\t苹果", "apple,苹果", "apple=苹果", "apple:苹果",
   and reversed "苹果 apple". Splits by first Chinese char boundary. */
function parseWordImport(text){
  const words=[]; let skipped=0;
  const lines=String(text||'').split(/\r\n|\r|\n/);
  const isCn=function(c){ return /[\u4e00-\u9fff]/.test(c); };
  const isEn=function(c){ return /[A-Za-z]/.test(c); };
  for(let line of lines){
    line=line.trim();
    if(!line) continue;
    // skip obvious headers/footers
    if(/^(序号|单词|词汇|英文|中文|word|no\.?|vocab|单词表)/i.test(line) && line.length<30){ skipped++; continue; }
    // strip trailing punctuation like "apple 苹果。"
    line=line.replace(/[。；;，,]$/,'').trim();
    // try explicit separators first
    let m=line.match(/^([A-Za-z][A-Za-z\s'\-\.]*?)\s*([=\t,，:：|/]+)\s*([\u4e00-\u9fff].*)$/);
    if(m){
      words.push({en:cleanEn(m[1]), cn:cleanCn(m[3])});
      continue;
    }
    // reversed: 中文 first, then english
    let m2=line.match(/^([\u4e00-\u9fff][\u4e00-\u9fff\s，。；、]*?)\s+([A-Za-z][A-Za-z\s'\-\.]*)$/);
    if(m2){
      words.push({en:cleanEn(m2[2]), cn:cleanCn(m2[1])});
      continue;
    }
    // generic: find boundary between english and chinese
    let cnIdx=-1;
    for(let i=0;i<line.length;i++){ if(isCn(line[i])){ cnIdx=i; break; } }
    if(cnIdx>0){
      const enPart=line.slice(0,cnIdx).trim();
      const cnPart=line.slice(cnIdx).trim();
      if(/[A-Za-z]/.test(enPart) && isCn(cnPart)){
        const en=cleanEn(enPart);
        const cn=cleanCn(cnPart);
        if(en && cn){ words.push({en:en, cn:cn}); continue; }
      }
    }
    // english first, chinese later separated by spaces (e.g. "apple 苹果")
    let m3=line.match(/^([A-Za-z][A-Za-z\s'\-\.]*?)\s+([\u4e00-\u9fff].*)$/);
    if(m3){
      const en=cleanEn(m3[1]); const cn=cleanCn(m3[2]);
      if(en&&cn){ words.push({en:en, cn:cn}); continue; }
    }
    skipped++;
  }
  return {words:words, skipped:skipped};
}
function cleanEn(s){
  return String(s).replace(/^[\/\[\{\(]+/,'').replace(/[\/\]\}\)]+$/,'').trim();
}
function cleanCn(s){
  return String(s).replace(/^[：:，,。；;\s]+/,'').replace(/[。；;，,]$/,'').trim();
}

function bindShopActions(){
  modalPanel.querySelectorAll('[data-shop]').forEach(b=>{
    b.addEventListener('click',function(){
      Sound.init();
      const act=this.getAttribute('data-shop');
      const [kind,id]=act.split(':');
      if(kind==='buy'){
        const sk=SKINS.find(s=>s.id===id);
        if(!sk) return;
        if(profile.coins>=sk.price){
          profile.coins-=sk.price;
          profile.ownedSkins.push(id);
          profile.equipSkin=id;
          saveProfile(); applySkin();
          toast('🎨 已购买并装备 '+sk.name+'！');
          renderShop();
        }else{ toast('🪙 金币不足 · Not enough coins', true); }
      }else if(kind==='equip'){
        profile.equipSkin=id; saveProfile(); applySkin();
        toast('🎨 已装备新皮肤 · Equipped');
        renderShop();
      }else if(kind==='upgrade'){
        const it=SHOP_ITEMS.find(s=>s.id===id);
        if(!it) return;
        const cur=it.cur();
        if(cur>=it.max){ return; }
        const price=it.prices[Math.min(cur,it.prices.length-1)];
        if(profile.coins>=price){
          profile.coins-=price;
          applyUpgrade(id);
          saveProfile();
          toast('⚡ 升级成功 · Upgraded '+it.name+'！');
          renderShop();
        }else{ toast('🪙 金币不足 · Not enough coins', true); }
      }else if(kind==='consumable'){
        const c=SHOP_CONSUMABLES.find(s=>s.id===id);
        if(!c) return;
        // nuke is one-shot and cannot stack
        if(id==='nuke' && profile.nukeStock>=1){
          toast('☢ 你已经拥有核弹，用掉后再购买 · Nuke already owned', true);
          return;
        }
        if(profile.coins>=c.price){
          profile.coins-=c.price;
          buyConsumable(id);
          saveProfile();
          toast('🎒 已购买 '+c.name+'！');
          renderShop();
        }else{ toast('🪙 金币不足 · Not enough coins', true); }
      }
      this.blur();
    });
  });
  modalPanel.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click',function(){
      if(this.getAttribute('data-act')==='close') closeModal();
      this.blur();
    });
  });
}
function applyUpgrade(id){
  if(id==='speed') profile.speedLv++;
  else if(id==='damage') profile.dmgLv++;
  else if(id==='maxhp'){ profile.hpLv++; hpMax=3+profile.hpLv; }
  else if(id==='firerate') profile.fireRateLv++;
  else if(id==='doubleShell') profile.doubleShell=true;
  else if(id==='homing'){ profile.homingUnlock=true; if(profile.curWeapon==='normal'){ profile.curWeapon='homing'; weaponIdx=1; } }
  else if(id==='pierce'){ profile.pierceUnlock=true; }
  else if(id==='ricochet'){ profile.ricochetUnlock=true; }
  else if(id==='magnet'){ profile.magnetUnlock=true; }
  else if(id==='shield'){ profile.shieldUnlock=true; }
}

/* ---------------- Memory Strength Visualization ---------------- */
function renderMemoryStrength(){
  // collect all words that have been answered at least once
  const rows=[];
  for(let i=0;i<WORDS.length;i++){
    const key = WORDS[i].w.trim().toLowerCase();
    const rec = stats.words[key];
    if(rec && (rec.c+rec.w)>0){
      rows.push({ en: WORDS[i].w, cn: WORDS[i].cn, rec });
    }
  }
  // add custom words too
  for(const cw of customWords){
    const key = String(cw.w||'').trim().toLowerCase();
    const rec = stats.words[key];
    if(rec && (rec.c+rec.w)>0){
      rows.push({ en: cw.w, cn: cw.cn, rec });
    }
  }
  const counts = { new:0, low:0, mid:0, high:0 };
  for(const r of rows){
    counts[masteryLevel(masteryPct(r.rec))]++;
  }
  const dueCount = rows.filter(r=>srsIsDue(r.rec)).length;

  let html='<div class="modal-title">🧠 记忆强度 · MEMORY</div><div class="modal-sub">间隔重复 · 薄弱词优先 · Spaced repetition</div>';
  html+='<div class="modal-section">';
  html+='<div class="mastery-summary">'
    +'<div class="ms-chip"><b style="color:#f09595">'+counts.new+'</b><span>易错</span></div>'
    +'<div class="ms-chip"><b style="color:#ef9f27">'+counts.low+'</b><span>学习中</span></div>'
    +'<div class="ms-chip"><b style="color:#fad775">'+counts.mid+'</b><span>较熟</span></div>'
    +'<div class="ms-chip"><b style="color:#7dffc8">'+counts.high+'</b><span>已掌握</span></div>'
    +'</div>';
  html+='<div class="si-desc" style="margin-bottom:6px;">已学习 <b>'+rows.length+'</b> 词 · 待复习 <b style="color:#ef9f27">'+dueCount+'</b> 词（游戏中会优先出现）</div>';
  html+='</div>';

  html+='<div class="modal-section"><h4>📋 单词掌握度 Word mastery</h4>';
  if(!rows.length){
    html+='<div class="strength-empty">还没有学习记录，先去答题吧！</div>';
  } else {
    // sort: lowest mastery first (weakest on top)
    rows.sort((a,b)=>masteryPct(a.rec)-masteryPct(b.rec) || (a.rec.c+a.rec.w)-(b.rec.c+b.rec.w));
    for(const r of rows){
      const pct = masteryPct(r.rec);
      const lvl = masteryLevel(pct);
      const label = masteryLabel(pct);
      const next = srsNextReviewLabel(r.rec);
      const due = srsIsDue(r.rec);
      const fillClass = lvl==='new'?'mf-new':(lvl==='low'?'mf-low':(lvl==='mid'?'mf-mid':'mf-high'));
      const tagClass = 'tag-'+lvl;
      html+='<div class="strength-word">'
        +'<div class="sw-main">'
        +'<div class="sw-head"><span class="sw-en">'+escapeHtml(r.en)+'</span><span class="sw-cn">'+escapeHtml(r.cn)+'</span></div>'
        +'<div class="mastery-bar"><div class="mastery-fill '+fillClass+'" style="width:'+pct+'%"></div></div>'
        +'<div class="si-desc" style="margin-top:2px;">'+(due?'<span class="srs-due-dot"></span>待复习':'下次复习')+'：'+next+' · 对 '+r.rec.c+' / 错 '+r.rec.w+'</div>'
        +'</div>'
        +'<span class="sw-tag '+tagClass+'">'+label+'</span>'
        +'</div>';
    }
  }
  html+='</div>';
  html+='<button class="btn settings-btn" data-act="backsettings" style="width:100%;margin-top:4px;">← 返回设置</button>';
  html+='<button class="modal-close" data-act="close">关闭 · CLOSE</button>';
  openModal(html);
  modalPanel.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click',function(){
      const act=this.getAttribute('data-act');
      if(act==='close') closeModal();
      else if(act==='backsettings') renderSettings();
      this.blur();
    });
  });
}

/* =====================================================================
 * SAVE / LOAD (.sav file with version number, IE11 compatible)
 * =================================================================== */
const SAVE_VERSION = 4;
function readFileText(file, cb){
  // IE11-compatible FileReader (used for save-file import)
  if(typeof FileReader==='undefined'){ cb(''); return; }
  const fr=new FileReader();
  fr.onload=function(){ cb(String(fr.result||'')); };
  fr.onerror=function(){ cb(''); };
  try{ fr.readAsText(file, 'utf-8'); }
  catch(e){ try{ fr.readAsText(file); }catch(e2){ cb(''); } }
}
function initSaveLoad(){
  const inp=document.getElementById('saveFileInput');
  if(inp){
    inp.addEventListener('change',function(){
      const f=inp.files && inp.files[0];
      if(!f){ inp.value=''; return; }
      readFileText(f, function(text){
        const ok=applySaveData(text);
        if(ok){ toast('✅ 存档已恢复 · Save loaded'); renderSettings(); }
        else{ toast('⚠ 存档文件无效或版本不兼容 · Invalid save', true); }
      });
      inp.value='';
    });
  }
}
function buildSaveData(){
  return {
    version: SAVE_VERSION,
    savedAt: new Date().toISOString(),
    best: best,
    profile: profile,
    scope: scope,
    customWords: customWords,
    stats: stats,
    wrongBook: wrongBook,
    quizPrefs: quizPrefs,
  };
}
function exportSave(){
  try{
    const data=buildSaveData();
    const json=JSON.stringify(data);
    // Prefer Blob download; fallback for IE11
    if(typeof Blob!=='undefined' && typeof URL!=='undefined' && URL.createObjectURL){
      const blob=new Blob([json], {type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='word-tank-save-'+Date.now()+'.sav';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      toast('📤 存档已导出 · Save exported');
    }else if(typeof navigator!=='undefined' && navigator.msSaveBlob){
      // IE10/11
      navigator.msSaveBlob(new Blob([json]), 'word-tank-save.sav');
      toast('📤 存档已导出 · Save exported');
    }else{
      toast('⚠ 当前浏览器不支持导出 · Export unsupported', true);
    }
  }catch(e){ toast('⚠ 导出失败 · Export failed', true); }
}
function importSave(){
  const inp=document.getElementById('saveFileInput');
  if(inp) inp.click();
}
function applySaveData(text){
  let data;
  try{ data=JSON.parse(text); }catch(e){ return false; }
  if(!data || typeof data!=='object' || typeof data.version!=='number') return false;
  // accept version <= SAVE_VERSION (forward-compatible within same major)
  if(data.version>SAVE_VERSION){ return false; }
  if(data.best!==undefined) best=data.best;
  if(data.scope!==undefined) scope=data.scope;
  if(data.profile && typeof data.profile==='object'){
    profile = data.profile;
    // ensure all required fields exist
    const defs={coins:0,ownedSkins:['default'],equipSkin:'default',speedLv:0,dmgLv:0,hpLv:0,fireRateLv:0,doubleShell:false,homingUnlock:false,pierceUnlock:false,ricochetUnlock:false,magnetUnlock:false,shieldUnlock:false,shieldStock:0,medkitStock:0,nukeStock:0,curWeapon:'normal'};
    for(const k in defs){ if(profile[k]===undefined) profile[k]=defs[k]; }
    if(profile.totalPoints!==undefined) delete profile.totalPoints;
    if(profile.imported!==undefined) delete profile.imported;
    hpMax=computeHpMax();
    weaponIdx=ownedWeapons().indexOf(profile.curWeapon);
    if(weaponIdx<0) weaponIdx=0;
  }
  // restore custom words (prefer new field, fall back to legacy importedWords)
  if(data.customWords && Array.isArray(data.customWords)){
    customWords = data.customWords.filter(w=>w && w.w && w.cn);
  } else if(data.importedWords && Array.isArray(data.importedWords)){
    customWords = data.importedWords.filter(w=>w && w.w && w.cn);
  }
  saveCustomWords();
  customDone=new Set(); customWrong=[];
  // restore learning stats / wrong book / quiz prefs
  if(data.stats && typeof data.stats==='object' && data.stats.words){ stats=data.stats; saveStats(); }
  if(Array.isArray(data.wrongBook)){ wrongBook=data.wrongBook.filter(w=>w && w.en); saveWrongBook(); }
  if(data.quizPrefs && typeof data.quizPrefs==='object'){
    quizPrefs={ listen:true, spell:true, enChoice:true, sentenceRate:0.16, ...data.quizPrefs };
    saveQuizPrefs();
  }
  saveProfile();
  saveLS('wt_best',best);
  saveLS('wt_scope',scope);
  applySkin();
  buildLobbyStats();
  buildRangeGrid();
  return true;
}

/* ---------------- Events ---------------- */
canvas.addEventListener('mousemove',e=>{
  const p=toXY(e.clientX,e.clientY);
  if(Math.abs(p[0]-mouse.x)+Math.abs(p[1]-mouse.y)>1.5) touchMode=false;
  mouse.x=p[0]; mouse.y=p[1]; mouse.inside=true;
});
canvas.addEventListener('mousedown',e=>{
  e.preventDefault(); Sound.init();
  // Right-click: pause game / return to lobby (replaces old answer-to-reload)
  if(e.button===2){
    if(state==='playing'&&!quizEl.classList.contains('show')){
      if(paused){ paused=false; hideUI(); } else showPause();
    }else if(state!=='playing'){
      goLobby();
    }
    return;
  }
  // Left-click: fire (if no shells, fire() shows a friendly prompt)
  if(e.button!==0) return;
  mouse.down=true;
});
window.addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('mouseleave',()=>{ mouse.inside=false; mouse.down=false; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); Sound.init(); touchMode=true;
  document.body.classList.add('touch');
  mouse.inside=false; mouse.down=false;
  for(const t of e.changedTouches){
    const p=toXY(t.clientX,t.clientY);
    if(p[0]<W/2&&!sticks.move) sticks.move={id:t.identifier,bx:p[0],by:p[1],x:p[0],y:p[1]};
    else if(p[0]>=W/2&&!sticks.aim) sticks.aim={id:t.identifier,bx:p[0],by:p[1],x:p[0],y:p[1]};
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(btnTouches[t.identifier]!==undefined) continue;
    for(const key of ['move','aim']){
      const st=sticks[key];
      if(st&&st.id===t.identifier){ const p=toXY(t.clientX,t.clientY); st.x=p[0]; st.y=p[1]; }
    }
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    for(const key of ['move','aim']){
      const st=sticks[key];
      if(st&&st.id===t.identifier) sticks[key]=null;
    }
  }
}
canvas.addEventListener('touchend',endTouch,{passive:false});
canvas.addEventListener('touchcancel',endTouch,{passive:false});
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space') Sound.init();
  if(e.repeat) return;
  // SPACE: answer a question to reload shells (replaces old fire binding)
  if(e.code==='Space'){
    tryOpenQuiz();
  }
  // F: hold to charge nuke (handled in update loop via keys.KeyF)
  if(e.code==='KeyF'){
    if(state==='playing'&&!paused&&!quizEl.classList.contains('show')){
      if(profile.nukeStock>0){
        nukeCharging=true;
      }else{
        toast('☢ 你没有核弹 · 请到商店购买（100 金币）', true);
      }
    }
  }
  if((e.code==='KeyP'||e.code==='Escape')&&(state==='playing')&&!quizEl.classList.contains('show')){
    if(paused){ paused=false; hideUI(); } else showPause();
  }
});
window.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='KeyF'){ nukeCharging=false; nukeCharge=0; }
});
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(state==='playing'&&!paused&&!quizEl.classList.contains('show')) showPause();
    if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }else{
    Sound.init();
    if(state==='playing'&&Sound.enabled&&!Sound.musicOn) Sound.startMusic();
  }
});
document.getElementById('btn-lobby').addEventListener('click',function(){ Sound.init(); goLobby(); this.blur(); });
document.getElementById('btn-answer').addEventListener('click',function(){
  // Touch equivalent of SPACE (answer when out of shells)
  Sound.init();
  tryOpenQuiz();
  this.blur();
});
document.getElementById('btn-sound').addEventListener('click',function(){
  Sound.init();
  Sound.enabled=!Sound.enabled;
  if(!Sound.enabled) Sound.stopMusic(); else if(state==='playing') Sound.startMusic();
  syncSoundBtn();
  this.blur();
});
document.getElementById('btn-start').addEventListener('click',()=>{ Sound.init(); startGame(); });

quizPanelEl=document.getElementById('quizPanel');

playSeed=(Math.random()*2147483647)|0;

if(touchMode) document.body.classList.add('touch');

let lastT=performance.now();
function loop(now){
  let raw=now-lastT;
  if(!isFinite(raw)||raw<0) raw=16;
  lastT=now;
  const dt=Math.min(0.05,raw/1000);
  Perf.frames++;
  if(Perf.t===0) Perf.t=now;
  else if(now-Perf.t>=1000){
    const el=now-Perf.t;
    Perf.fps=Perf.frames*1000/el;
    Perf.frames=0; Perf.t=now;
    // Adaptive quality: scale down resolution-heavy effects when FPS drops.
    const target=Perf.fps<25?0.4:(Perf.fps<40?0.7:(Perf.fps<55?0.85:1));
    Perf.q+=(target-Perf.q)*0.3;
    if(Perf.q<0.4)Perf.q=0.4;
    if(Perf.q>1)Perf.q=1;
    // Toggle expensive shadow pass: enable only when comfortably fast, disable when struggling.
    if(Perf.fps<30) Perf.shadow=false;
    else if(Perf.fps>52 && Perf.q>0.8 && !_isLowEnd) Perf.shadow=true;
    if(Perf.fps<22) Perf.glow=false;
    else if(Perf.fps>45) Perf.glow=true;
  }
  try{
    update(dt);
    render();
  }catch(err){ /* drop frame */ }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
